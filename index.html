<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Grandmaster Chess Studio</title>
  <style>
    :root {
      --bg: #111317;
      --panel: #1a1d24;
      --panel-2: #222630;
      --border: #2f3442;
      --text: #eef1f6;
      --muted: #8f96a6;
      --accent: #7fa650;
      --accent-hover: #94bf61;
      --danger: #e55353;
      --warn: #e5a93b;
      --light-sq: #f0d9b5;
      --dark-sq: #b58863;
      --last-move: rgba(255, 235, 59, 0.42);
      --selected-sq: rgba(127, 166, 80, 0.6);
      --premove-sq: rgba(88, 130, 235, 0.55);
    }

    body[data-theme="tournament"] { --light-sq: #eeeed2; --dark-sq: #769656; }
    body[data-theme="midnight"]   { --light-sq: #c6cedb; --dark-sq: #4b5a73; }
    body[data-theme="ocean"]      { --light-sq: #d9e6ec; --dark-sq: #5c859e; }
    body[data-theme="rosewood"]   { --light-sq: #ebd6c8; --dark-sq: #99554b; }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, sans-serif;
      background: radial-gradient(circle at top, #181c24 0%, var(--bg) 70%);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 16px;
    }

    .studio {
      display: grid;
      grid-template-columns: 28px minmax(300px, 580px) 380px;
      gap: 16px;
      width: 100%;
      max-width: 1030px;
      align-items: stretch;
    }

    /* Evaluation Bar */
    .eval-col {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 58px 0;
    }

    .eval-bar {
      position: relative;
      width: 24px;
      flex: 1;
      background: #23262e;
      border-radius: 6px;
      overflow: hidden;
      border: 1px solid var(--border);
      box-shadow: inset 0 0 6px rgba(0,0,0,0.6);
    }

    .eval-fill {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 50%;
      background: #f2f4f8;
      transition: height 0.45s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .eval-bar.flipped .eval-fill {
      bottom: auto;
      top: 0;
    }

    .eval-label {
      position: absolute;
      left: 0;
      right: 0;
      text-align: center;
      font-size: 10px;
      font-weight: 800;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      pointer-events: none;
      z-index: 2;
      padding: 3px 0;
    }

    .eval-label.top { top: 4px; color: #f2f4f8; }
    .eval-label.bottom { bottom: 4px; color: #16181d; }

    /* Board Column */
    .board-col {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .player-card {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px 12px;
      min-height: 50px;
      gap: 10px;
    }

    .player-meta {
      display: flex;
      flex-direction: column;
      gap: 2px;
      min-width: 0;
    }

    .player-title {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 600;
      font-size: 0.92rem;
    }

    .avatar {
      width: 22px;
      height: 22px;
      border-radius: 5px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      border: 1px solid var(--border);
    }
    .avatar.w { background: #f2f4f8; color: #16181d; }
    .avatar.b { background: #262a34; color: #f2f4f8; }

    .turn-pill {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: transparent;
    }
    .turn-pill.active {
      background: var(--accent);
      box-shadow: 0 0 8px var(--accent);
    }

    .captured-strip {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      min-height: 18px;
      gap: 1px;
    }

    .cap-icon {
      width: 17px;
      height: 17px;
      display: inline-flex;
      margin-right: -2px;
    }

    .mat-diff {
      font-size: 0.76rem;
      color: var(--muted);
      font-weight: 700;
      margin-left: 6px;
    }

    .clock {
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 1.1rem;
      font-weight: 700;
      background: var(--panel-2);
      border: 1px solid var(--border);
      padding: 6px 12px;
      border-radius: 6px;
      min-width: 86px;
      text-align: center;
      color: var(--muted);
      transition: all 0.2s;
    }

    .clock.active {
      color: var(--text);
      border-color: var(--accent);
      background: #252c24;
    }

    .clock.low {
      color: #ff8e8e;
      border-color: var(--danger);
      background: #351d20;
    }

    .clock.hidden { display: none; }

    /* Chessboard */
    .board-stage {
      position: relative;
      width: 100%;
      aspect-ratio: 1 / 1;
      border-radius: 6px;
      overflow: hidden;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.65);
      border: 2px solid #2a2e38;
      user-select: none;
      -webkit-user-select: none;
    }

    .board {
      display: grid;
      grid-template-columns: repeat(8, 1fr);
      grid-template-rows: repeat(8, 1fr);
      width: 100%;
      height: 100%;
    }

    .square {
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
    }

    .square.light { background: var(--light-sq); }
    .square.dark  { background: var(--dark-sq); }

    .square.last-move::before,
    .square.selected::before,
    .square.premove::before,
    .square.anno-sq::before {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
    }

    .square.last-move::before { background: var(--last-move); }
    .square.selected::before  { background: var(--selected-sq); }
    .square.premove::before   { background: var(--premove-sq); }
    .square.anno-sq::before   { background: rgba(235, 87, 87, 0.58); z-index: 4; }

    .square.in-check {
      background: radial-gradient(circle, rgba(255, 50, 50, 0.96) 0%, rgba(190, 25, 25, 0.78) 65%, transparent 100%);
    }

    .coord-rank, .coord-file {
      position: absolute;
      font-size: 11px;
      font-weight: 700;
      pointer-events: none;
      line-height: 1;
      opacity: 0.85;
      z-index: 1;
    }
    .coord-rank { top: 3px; left: 4px; }
    .coord-file { bottom: 3px; right: 4px; }
    .square.light .coord-rank, .square.light .coord-file { color: var(--dark-sq); }
    .square.dark  .coord-rank, .square.dark  .coord-file { color: var(--light-sq); }

    .legal-dot {
      position: absolute;
      width: 28%;
      height: 28%;
      border-radius: 50%;
      background: rgba(0, 0, 0, 0.24);
      pointer-events: none;
      z-index: 2;
    }

    .legal-ring {
      position: absolute;
      width: 86%;
      height: 86%;
      border-radius: 50%;
      border: 5px solid rgba(0, 0, 0, 0.24);
      pointer-events: none;
      z-index: 2;
    }

    .piece {
      width: 86%;
      height: 86%;
      z-index: 3;
      cursor: grab;
      will-change: transform;
    }

    .piece:active { cursor: grabbing; }

    .piece svg {
      width: 100%;
      height: 100%;
      display: block;
      filter: drop-shadow(0 2px 3px rgba(0, 0, 0, 0.28));
    }

    /* Tactical SVG Arrow Overlay */
    .arrow-layer {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 6;
    }

    .opening-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.8rem;
      color: var(--muted);
      padding: 2px 4px;
    }

    .opening-name {
      color: var(--text);
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Sidebar */
    .sidebar {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .brand {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border);
      padding-bottom: 10px;
    }

    .brand h1 {
      font-size: 1.12rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .badge {
      font-size: 0.68rem;
      background: rgba(127, 166, 80, 0.18);
      color: var(--accent-hover);
      border: 1px solid rgba(127, 166, 80, 0.4);
      padding: 2px 7px;
      border-radius: 99px;
      font-weight: 700;
      text-transform: uppercase;
    }

    .status-box {
      background: var(--panel-2);
      border-left: 4px solid var(--accent);
      padding: 9px 12px;
      border-radius: 6px;
      font-size: 0.88rem;
      font-weight: 600;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .status-box.check { border-left-color: var(--danger); color: #ffa4a4; }
    .status-box.gameover { border-left-color: var(--warn); color: #ffe29e; }
    .status-box.review { border-left-color: #5ca4f7; color: #b5d7ff; }

    .settings-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .field label {
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      color: var(--muted);
      font-weight: 700;
    }

    select, button, input, textarea {
      font-family: inherit;
      font-size: 0.84rem;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: var(--panel-2);
      color: var(--text);
      padding: 8px 10px;
    }

    select, button { cursor: pointer; transition: background 0.15s, border-color 0.15s; }
    button:hover:not(:disabled) { background: #2d3240; border-color: #42495c; }
    button:disabled { opacity: 0.42; cursor: not-allowed; }

    button.primary {
      background: var(--accent);
      color: #111317;
      font-weight: 700;
      border-color: var(--accent);
    }
    button.primary:hover:not(:disabled) { background: var(--accent-hover); }

    .actions-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 7px;
    }

    /* Move List */
    .moves-panel {
      display: flex;
      flex-direction: column;
      gap: 6px;
      flex: 1;
      min-height: 180px;
    }

    .moves-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .moves-header span {
      font-size: 0.74rem;
      text-transform: uppercase;
      letter-spacing: 0.7px;
      color: var(--muted);
      font-weight: 700;
    }

    .move-list {
      background: #13151a;
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 6px;
      height: 220px;
      overflow-y: auto;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 0.84rem;
    }

    .move-row {
      display: grid;
      grid-template-columns: 34px 1fr 1fr;
      align-items: center;
      padding: 2px 4px;
      border-radius: 4px;
    }

    .move-row:nth-child(odd) { background: rgba(255, 255, 255, 0.025); }
    .move-num { color: var(--muted); font-size: 0.78rem; }

    .move-cell {
      padding: 3px 6px;
      border-radius: 4px;
      cursor: pointer;
    }
    .move-cell:hover { background: rgba(255, 255, 255, 0.08); }
    .move-cell.active {
      background: rgba(127, 166, 80, 0.35);
      color: #fff;
      font-weight: 700;
    }

    .nav-bar {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
    }
    .nav-bar button { padding: 6px; font-weight: 700; }

    .tools-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    /* Overlays & Modals */
    .overlay {
      position: absolute;
      inset: 0;
      background: rgba(10, 12, 16, 0.78);
      backdrop-filter: blur(3px);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 25;
      padding: 16px;
    }
    .overlay.open { display: flex; }

    .dialog {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 18px;
      text-align: center;
      max-width: 340px;
      width: 100%;
      box-shadow: 0 18px 40px rgba(0, 0, 0, 0.7);
    }

    .dialog h2 { font-size: 1.15rem; margin-bottom: 6px; }
    .dialog p  { font-size: 0.88rem; color: var(--muted); margin-bottom: 14px; }

    .promo-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
    }

    .promo-btn {
      aspect-ratio: 1 / 1;
      padding: 6px;
      background: var(--light-sq);
      border: 2px solid transparent;
    }
    .promo-btn:hover { border-color: var(--accent); background: #fff0d4; }

    .dialog-actions {
      display: flex;
      gap: 8px;
      justify-content: center;
    }

    /* Global Modal for PGN / FEN */
    .global-modal {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(4px);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 50;
      padding: 16px;
    }
    .global-modal.open { display: flex; }

    .global-dialog {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 18px;
      width: 100%;
      max-width: 480px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .global-dialog textarea {
      width: 100%;
      min-height: 90px;
      resize: vertical;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 0.8rem;
    }

    .fen-row {
      display: flex;
      gap: 8px;
    }
    .fen-row input { flex: 1; font-family: ui-monospace, monospace; font-size: 0.78rem; }

    .hint-msg { font-size: 0.78rem; color: var(--danger); min-height: 16px; }

    @media (max-width: 960px) {
      .studio {
        grid-template-columns: 1fr;
        max-width: 580px;
      }
      .eval-col { display: none; }
      .move-list { height: 150px; }
    }
  </style>
</head>
<body data-theme="walnut">
  <div class="studio">
    <!-- Evaluation Bar -->
    <div class="eval-col" title="Real-time Engine Evaluation">
      <div class="eval-bar" id="eval-bar">
        <div class="eval-fill" id="eval-fill"></div>
        <span class="eval-label top" id="eval-top"></span>
        <span class="eval-label bottom" id="eval-bottom">0.0</span>
      </div>
    </div>

    <!-- Center Board Column -->
    <div class="board-col">
      <div class="player-card">
        <div class="player-meta">
          <div class="player-title">
            <span class="avatar b" id="top-avatar">♚</span>
            <span class="turn-pill" id="top-dot"></span>
            <span id="top-name">Black</span>
          </div>
          <div class="captured-strip" id="top-captured"></div>
        </div>
        <div class="clock hidden" id="top-clock">05:00</div>
      </div>

      <div class="board-stage" id="board-stage">
        <div class="board" id="board"></div>
        <svg class="arrow-layer" id="arrow-layer" viewBox="0 0 800 800">
          <defs>
            <marker id="arrow-orange" markerWidth="4" markerHeight="4" refX="2.5" refY="2" orient="auto">
              <polygon points="0 0, 4 2, 0 4" fill="rgba(245, 166, 35, 0.88)" />
            </marker>
            <marker id="arrow-cyan" markerWidth="4" markerHeight="4" refX="2.5" refY="2" orient="auto">
              <polygon points="0 0, 4 2, 0 4" fill="rgba(56, 189, 248, 0.92)" />
            </marker>
          </defs>
        </svg>

        <!-- Promotion Modal -->
        <div class="overlay" id="promo-overlay">
          <div class="dialog">
            <h2>Promote Pawn</h2>
            <p>Select replacement piece</p>
            <div class="promo-grid" id="promo-choices"></div>
          </div>
        </div>

        <!-- Game Over Modal -->
        <div class="overlay" id="gameover-overlay">
          <div class="dialog">
            <h2 id="go-title">Game Over</h2>
            <p id="go-subtitle"></p>
            <div class="dialog-actions">

              <button id="go-review">Review Board</button>
            </div>
          </div>

      </div>

      <div class="player-card">
        <div class="player-meta">
          <div class="player-title">
            <span class="avatar w" id="bottom-avatar">♔</span>
            <span class="turn-pill" id="bottom-dot"></span>
            <span id="bottom-name">White</span>
          </div>

        </div>

      </div>

      <div class="opening-bar">
        <span class="opening-name" id="opening-name">Starting Position</span>
        <span>Right-click to highlight / draw arrows</span>
      </div>
    </div>

    <!-- Right Control Sidebar -->
    <aside class="sidebar">
      <div class="brand">
        <h1>♟ Chess Studio <span class="badge">Engine v2</span></h1>
        <button id="sound-btn" title="Toggle Sound">🔊</button>
      </div>

      <div class="status-box" id="status-box">
        <span id="status-text">White's turn</span>
      </div>

      <div class="settings-grid">
        <div class="field">
          <label for="mode-select">Mode</label>
          <select id="mode-select">
            <option value="ai-b">vs AI (Play White)</option>
            <option value="ai-w">vs AI (Play Black)</option>
            <option value="pvp">2 Players (Local)</option>
          </select>
        </div>
        <div class="field" id="depth-field">
          <label for="depth-select">AI Level</label>
          <select id="depth-select">
            <option value="1">Beginner</option>
            <option value="2">Casual</option>
            <option value="3" selected>Club</option>
            <option value="4">Master</option>
          </select>
        </div>
        <div class="field">
          <label for="time-select">Time Control</label>
          <select id="time-select">
            <option value="0,0">Untimed</option>
            <option value="60,0">1+0 Bullet</option>
            <option value="180,2" selected>3+2 Blitz</option>
            <option value="300,0">5+0 Blitz</option>
            <option value="600,0">10+0 Rapid</option>
          </select>
        </div>
        <div class="field">
          <label for="theme-select">Board Theme</label>
          <select id="theme-select">
            <option value="walnut">Classic Walnut</option>
            <option value="tournament">Tournament Green</option>
            <option value="midnight">Midnight Slate</option>
            <option value="ocean">Ocean Blue</option>
            <option value="rosewood">Rosewood</option>
          </select>
        </div>
      </div>

      <div class="actions-grid">
        <button class="primary" id="new-game-btn">New Game</button>
        <button id="hint-btn">💡 Hint</button>
        <button id="undo-btn">↩ Undo</button>
        <button id="flip-btn">⇅ Flip</button>
        <button id="resign-btn">🏳 Resign</button>
        <button id="pgn-btn">📋 PGN / FEN</button>
      </div>

      <div class="moves-panel">
        <div class="moves-header">
          <span>Move History</span>
          <span id="ply-counter">0 moves</span>
        </div>
        <div class="move-list" id="move-list"></div>
        <div class="nav-bar">
          <button id="nav-start" title="First Move (Home)">|&lt;</button>
          <button id="nav-prev" title="Previous Move (Left Arrow)">&lt;</button>
          <button id="nav-next" title="Next Move (Right Arrow)">&gt;</button>
          <button id="nav-end" title="Latest Move (End)">&gt;|</button>
        </div>
      </div>
    </aside>
  </div>

  <!-- PGN / FEN Modal -->
  <div class="global-modal" id="pgn-modal">
    <div class="global-dialog">
      <h3>PGN &amp; FEN Studio</h3>
      <div class="field">
        <label>Current FEN (or paste FEN to load)</label>
        <div class="fen-row">
          <input type="text" id="fen-input" />
          <button id="load-fen-btn">Load</button>
          <button id="copy-fen-btn">Copy</button>
        </div>
        <div class="hint-msg" id="fen-error"></div>
      </div>
      <div class="field">
        <label>PGN Notation</label>
        <textarea id="pgn-output" readonly></textarea>
      </div>
      <div class="tools-row">
        <button class="primary" id="copy-pgn-btn">Copy PGN</button>
        <button id="close-pgn-btn">Close</button>
      </div>
    </div>
  </div>

  <script>
    // =========================================================================
    // 1. PURE CHESS ENGINE & AI CORE (Shared identically with Web Worker)
    // =========================================================================
    function createEngineCore() {
      const PIECE_VAL = { P: 100, N: 320, B: 330, R: 500, Q: 900, K: 20000 };

      const PST_MG = {
        P: [
          [  0,  0,  0,  0,  0,  0,  0,  0],
          [ 50, 50, 50, 50, 50, 50, 50, 50],
          [ 10, 10, 20, 30, 30, 20, 10, 10],
          [  5,  5, 10, 27, 27, 10,  5,  5],
          [  0,  0,  0, 24, 24,  0,  0,  0],
          [  5, -5,-10,  0,  0,-10, -5,  5],
          [  5, 10, 10,-22,-22, 10, 10,  5],
          [  0,  0,  0,  0,  0,  0,  0,  0]
        ],
        N: [
          [-50,-40,-30,-30,-30,-30,-40,-50],
          [-40,-20,  0,  0,  0,  0,-20,-40],
          [-30,  0, 10, 15, 15, 10,  0,-30],
          [-30,  5, 15, 20, 20, 15,  5,-30],
          [-30,  0, 15, 20, 20, 15,  0,-30],
          [-30,  5, 10, 15, 15, 10,  5,-30],
          [-40,-20,  0,  5,  5,  0,-20,-40],
          [-50,-40,-30,-30,-30,-30,-40,-50]
        ],
        B: [
          [-20,-10,-10,-10,-10,-10,-10,-20],
          [-10,  0,  0,  0,  0,  0,  0,-10],
          [-10,  0,  5, 10, 10,  5,  0,-10],
          [-10,  5,  5, 10, 10,  5,  5,-10],
          [-10,  0, 12, 10, 10, 12,  0,-10],
          [-10, 10, 10, 10, 10, 10, 10,-10],
          [-10,  5,  0,  0,  0,  0,  5,-10],
          [-20,-10,-10,-10,-10,-10,-10,-20]
        ],
        R: [
          [  0,  0,  0,  0,  0,  0,  0,  0],
          [  5, 12, 12, 12, 12, 12, 12,  5],
          [ -5,  0,  0,  0,  0,  0,  0, -5],
          [ -5,  0,  0,  0,  0,  0,  0, -5],
          [ -5,  0,  0,  0,  0,  0,  0, -5],
          [ -5,  0,  0,  0,  0,  0,  0, -5],
          [ -5,  0,  0,  0,  0,  0,  0, -5],
          [  0,  0,  0,  6,  6,  0,  0,  0]
        ],
        Q: [
          [-20,-10,-10, -5, -5,-10,-10,-20],
          [-10,  0,  0,  0,  0,  0,  0,-10],
          [-10,  0,  5,  5,  5,  5,  0,-10],
          [ -5,  0,  5,  5,  5,  5,  0, -5],
          [  0,  0,  5,  5,  5,  5,  0, -5],
          [-10,  5,  5,  5,  5,  5,  0,-10],
          [-10,  0,  5,  0,  0,  0,  0,-10],
          [-20,-10,-10, -5, -5,-10,-10,-20]
        ],
        K: [
          [-30,-40,-40,-50,-50,-40,-40,-30],
          [-30,-40,-40,-50,-50,-40,-40,-30],
          [-30,-40,-40,-50,-50,-40,-40,-30],
          [-30,-40,-40,-50,-50,-40,-40,-30],
          [-20,-30,-30,-40,-40,-30,-30,-20],
          [-10,-20,-20,-20,-20,-20,-20,-10],
          [ 20, 20,  0,  0,  0,  0, 20, 20],
          [ 20, 30, 10,  0,  0, 10, 30, 20]
        ]
      };

      const PST_K_EG = [
        [-50,-40,-30,-20,-20,-30,-40,-50],
        [-30,-20,-10,  0,  0,-10,-20,-30],
        [-30,-10, 20, 30, 30, 20,-10,-30],
        [-30,-10, 30, 40, 40, 30,-10,-30],
        [-30,-10, 30, 40, 40, 30,-10,-30],
        [-30,-10, 20, 30, 30, 20,-10,-30],
        [-30,-30,  0,  0,  0,  0,-30,-30],
        [-50,-30,-30,-30,-30,-30,-30,-50]
      ];

      function inBounds(r, c) { return r >= 0 && r < 8 && c >= 0 && c < 8; }

      function cloneState(s) {
        return {
          board: s.board.map(r => r.slice()),
          turn: s.turn,
          castling: { ...s.castling },
          enPassant: s.enPassant ? { ...s.enPassant } : null,
          halfMoveClock: s.halfMoveClock,
          fullMove: s.fullMove,
          captured: { w: s.captured.w.slice(), b: s.captured.b.slice() },
          lastMove: s.lastMove ? { ...s.lastMove } : null
        };
      }

      function findKing(board, color) {
        const target = color + "K";
        for (let r = 0; r < 8; r++) {
          for (let c = 0; c < 8; c++) {
            if (board[r][c] === target) return { r, c };
          }
        }
        return null;
      }

      function isSquareAttacked(board, r, c, attacker) {
        const pawnDir = attacker === "w" ? 1 : -1;
        if (inBounds(r + pawnDir, c - 1) && board[r + pawnDir][c - 1] === attacker + "P") return true;
        if (inBounds(r + pawnDir, c + 1) && board[r + pawnDir][c + 1] === attacker + "P") return true;

        const jumps = [[-2,-1],[-2,1],[-1,-2],[-1,2],[1,-2],[1,2],[2,-1],[2,1]];
        for (let i = 0; i < 8; i++) {
          const nr = r + jumps[i][0], nc = c + jumps[i][1];
          if (inBounds(nr, nc) && board[nr][nc] === attacker + "N") return true;
        }

        for (let dr = -1; dr <= 1; dr++) {
          for (let dc = -1; dc <= 1; dc++) {
            if (dr === 0 && dc === 0) continue;
            const kr = r + dr, kc = c + dc;
            if (inBounds(kr, kc) && board[kr][kc] === attacker + "K") return true;
          }
        }

        const ortho = [[-1,0],[1,0],[0,-1],[0,1]];
        for (let i = 0; i < 4; i++) {
          let nr = r + ortho[i][0], nc = c + ortho[i][1];
          while (inBounds(nr, nc)) {
            const p = board[nr][nc];
            if (p) {
              if (p[0] === attacker && (p[1] === "R" || p[1] === "Q")) return true;
              break;
            }
            nr += ortho[i][0]; nc += ortho[i][1];
          }
        }

        const diag = [[-1,-1],[-1,1],[1,-1],[1,1]];
        for (let i = 0; i < 4; i++) {
          let nr = r + diag[i][0], nc = c + diag[i][1];
          while (inBounds(nr, nc)) {
            const p = board[nr][nc];
            if (p) {
              if (p[0] === attacker && (p[1] === "B" || p[1] === "Q")) return true;
              break;
            }
            nr += diag[i][0]; nc += diag[i][1];
          }
        }
        return false;
      }

      function isKingInCheck(board, color) {
        const k = findKing(board, color);
        return k ? isSquareAttacked(board, k.r, k.c, color === "w" ? "b" : "w") : false;
      }

      function getPseudoMovesForPiece(state, r, c) {
        const piece = state.board[r][c];
        if (!piece) return [];
        const color = piece[0], type = piece[1];
        const opp = color === "w" ? "b" : "w";
        const moves = [];

        if (type === "P") {
          const dir = color === "w" ? -1 : 1;
          const startRow = color === "w" ? 6 : 1;
          const promoRow = color === "w" ? 0 : 7;

          if (inBounds(r + dir, c) && !state.board[r + dir][c]) {
            if (r + dir === promoRow) {
              for (const promo of ["Q", "R", "B", "N"]) moves.push({ fromR: r, fromC: c, toR: r + dir, toC: c, promo });
            } else {
              moves.push({ fromR: r, fromC: c, toR: r + dir, toC: c });
              if (r === startRow && !state.board[r + 2 * dir][c]) {
                moves.push({ fromR: r, fromC: c, toR: r + 2 * dir, toC: c, doublePush: true });
              }
            }
          }
          for (const dc of [-1, 1]) {
            const tr = r + dir, tc = c + dc;
            if (!inBounds(tr, tc)) continue;
            const target = state.board[tr][tc];
            if (target && target[0] === opp) {
              if (tr === promoRow) {
                for (const promo of ["Q", "R", "B", "N"]) moves.push({ fromR: r, fromC: c, toR: tr, toC: tc, promo });
              } else {
                moves.push({ fromR: r, fromC: c, toR: tr, toC: tc });
              }
            } else if (state.enPassant && state.enPassant.r === tr && state.enPassant.c === tc) {
              moves.push({ fromR: r, fromC: c, toR: tr, toC: tc, enPassant: true });
            }
          }
        } else if (type === "N") {
          const jumps = [[-2,-1],[-2,1],[-1,-2],[-1,2],[1,-2],[1,2],[2,-1],[2,1]];
          for (const [dr, dc] of jumps) {
            const tr = r + dr, tc = c + dc;
            if (inBounds(tr, tc) && (!state.board[tr][tc] || state.board[tr][tc][0] === opp)) {
              moves.push({ fromR: r, fromC: c, toR: tr, toC: tc });
            }
          }
        } else if (type === "B" || type === "R" || type === "Q") {
          const dirs = [];
          if (type !== "R") dirs.push([-1,-1],[-1,1],[1,-1],[1,1]);
          if (type !== "B") dirs.push([-1,0],[1,0],[0,-1],[0,1]);
          for (const [dr, dc] of dirs) {
            let tr = r + dr, tc = c + dc;
            while (inBounds(tr, tc)) {
              const target = state.board[tr][tc];
              if (!target) moves.push({ fromR: r, fromC: c, toR: tr, toC: tc });
              else {
                if (target[0] === opp) moves.push({ fromR: r, fromC: c, toR: tr, toC: tc });
                break;
              }
              tr += dr; tc += dc;
            }
          }
        } else if (type === "K") {
          for (let dr = -1; dr <= 1; dr++) {
            for (let dc = -1; dc <= 1; dc++) {
              if (dr === 0 && dc === 0) continue;
              const tr = r + dr, tc = c + dc;
              if (inBounds(tr, tc) && (!state.board[tr][tc] || state.board[tr][tc][0] === opp)) {
                moves.push({ fromR: r, fromC: c, toR: tr, toC: tc });
              }
            }
          }
          const homeRow = color === "w" ? 7 : 0;
          if (r === homeRow && c === 4 && !isSquareAttacked(state.board, homeRow, 4, opp)) {
            if (state.castling[color + "K"] &&
                !state.board[homeRow][5] && !state.board[homeRow][6] &&
                state.board[homeRow][7] === color + "R" &&
                !isSquareAttacked(state.board, homeRow, 5, opp) &&
                !isSquareAttacked(state.board, homeRow, 6, opp)) {
              moves.push({ fromR: r, fromC: c, toR: homeRow, toC: 6, castle: "K" });
            }
            if (state.castling[color + "Q"] &&
                !state.board[homeRow][3] && !state.board[homeRow][2] && !state.board[homeRow][1] &&
                state.board[homeRow][0] === color + "R" &&
                !isSquareAttacked(state.board, homeRow, 3, opp) &&
                !isSquareAttacked(state.board, homeRow, 2, opp)) {
              moves.push({ fromR: r, fromC: c, toR: homeRow, toC: 2, castle: "Q" });
            }
          }
        }
        return moves;
      }

      function applyMove(state, move) {
        const next = cloneState(state);
        const { fromR, fromC, toR, toC } = move;
        const piece = next.board[fromR][fromC];
        const color = piece[0], type = piece[1];
        let capturedPiece = next.board[toR][toC];

        if (move.enPassant) {
          capturedPiece = next.board[fromR][toC];
          next.board[fromR][toC] = null;
        }
        if (capturedPiece) next.captured[color].push(capturedPiece);

        next.board[toR][toC] = move.promo ? color + move.promo : piece;
        next.board[fromR][fromC] = null;

        if (move.castle === "K") {
          next.board[toR][5] = next.board[toR][7];
          next.board[toR][7] = null;
        } else if (move.castle === "Q") {
          next.board[toR][3] = next.board[toR][0];
          next.board[toR][0] = null;
        }

        if (type === "K") {
          next.castling[color + "K"] = false;
          next.castling[color + "Q"] = false;
        }
        if (type === "R") {
          if (fromR === 7 && fromC === 7) next.castling.wK = false;
          if (fromR === 7 && fromC === 0) next.castling.wQ = false;
          if (fromR === 0 && fromC === 7) next.castling.bK = false;
          if (fromR === 0 && fromC === 0) next.castling.bQ = false;
        }
        if (toR === 7 && toC === 7) next.castling.wK = false;
        if (toR === 7 && toC === 0) next.castling.wQ = false;
        if (toR === 0 && toC === 7) next.castling.bK = false;
        if (toR === 0 && toC === 0) next.castling.bQ = false;

        next.enPassant = move.doublePush ? { r: (fromR + toR) / 2, c: fromC } : null;
        next.halfMoveClock = (type === "P" || capturedPiece) ? 0 : next.halfMoveClock + 1;
        if (color === "b") next.fullMove += 1;
        next.turn = color === "w" ? "b" : "w";
        next.lastMove = { fromR, fromC, toR, toC };
        return next;
      }

      function getLegalMoves(state, color = state.turn) {
        const legal = [];
        for (let r = 0; r < 8; r++) {
          for (let c = 0; c < 8; c++) {
            const p = state.board[r][c];
            if (p && p[0] === color) {
              const pseudo = getPseudoMovesForPiece(state, r, c);
              for (let i = 0; i < pseudo.length; i++) {
                const after = applyMove(state, pseudo[i]);
                if (!isKingInCheck(after.board, color)) legal.push(pseudo[i]);
              }
            }
          }
        }
        return legal;
      }

      function isInsufficientMaterial(board) {
        const pieces = [];
        for (let r = 0; r < 8; r++) {
          for (let c = 0; c < 8; c++) {
            const p = board[r][c];
            if (p && p[1] !== "K") pieces.push({ p, r, c });
          }
        }
        if (pieces.length === 0) return true;
        if (pieces.length === 1 && (pieces[0].p[1] === "N" || pieces[0].p[1] === "B")) return true;
        if (pieces.length === 2 && pieces[0].p[1] === "B" && pieces[1].p[1] === "B") {
          return ((pieces[0].r + pieces[0].c) % 2) === ((pieces[1].r + pieces[1].c) % 2);
        }
        return false;
      }

      function getPositionKey(state) {
        let key = "";
        for (let r = 0; r < 8; r++) {
          for (let c = 0; c < 8; c++) key += state.board[r][c] || ".";
        }
        key += "|" + state.turn;
        key += "|" + (state.castling.wK ? "K" : "") + (state.castling.wQ ? "Q" : "") + (state.castling.bK ? "k" : "") + (state.castling.bQ ? "q" : "");
        if (state.enPassant) {
          const epR = state.enPassant.r, epC = state.enPassant.c;
          const pawnR = state.turn === "w" ? epR + 1 : epR - 1;
          const canEP = (inBounds(pawnR, epC - 1) && state.board[pawnR][epC - 1] === state.turn + "P") ||
                        (inBounds(pawnR, epC + 1) && state.board[pawnR][epC + 1] === state.turn + "P");
          if (canEP) key += `|${epR},${epC}`;
        }
        return key;
      }

      function evaluateBoard(state) {
        let nonKingMat = 0;
        let wBishops = 0, bBishops = 0;
        for (let r = 0; r < 8; r++) {
          for (let c = 0; c < 8; c++) {
            const p = state.board[r][c];
            if (!p || p[1] === "K") continue;
            nonKingMat += PIECE_VAL[p[1]];
            if (p === "wB") wBishops++;
            if (p === "bB") bBishops++;
          }
        }
        const isEndgame = nonKingMat <= 2600;
        let score = 0;
        if (wBishops >= 2) score += 30;
        if (bBishops >= 2) score -= 30;

        for (let r = 0; r < 8; r++) {
          for (let c = 0; c < 8; c++) {
            const p = state.board[r][c];
            if (!p) continue;
            const type = p[1], color = p[0];
            const pstRow = color === "w" ? r : 7 - r;
            const table = (type === "K" && isEndgame) ? PST_K_EG : PST_MG[type];
            const val = PIECE_VAL[type] + table[pstRow][c];
            score += color === "w" ? val : -val;
          }
        }
        return score;
      }

      function orderMoves(state, moves, ttBestKey) {
        return moves.sort((a, b) => {
          const kA = `${a.fromR}${a.fromC}${a.toR}${a.toC}${a.promo || ""}`;
          const kB = `${b.fromR}${b.fromC}${b.toR}${b.toC}${b.promo || ""}`;
          if (kA === ttBestKey) return -1;
          if (kB === ttBestKey) return 1;

          const capA = state.board[a.toR][a.toC] ? PIECE_VAL[state.board[a.toR][a.toC][1]] - PIECE_VAL[state.board[a.fromR][a.fromC][1]] / 10 : (a.enPassant ? 90 : 0);
          const capB = state.board[b.toR][b.toC] ? PIECE_VAL[state.board[b.toR][b.toC][1]] - PIECE_VAL[state.board[b.fromR][b.fromC][1]] / 10 : (b.enPassant ? 90 : 0);
          const pA = a.promo === "Q" ? 800 : 0;
          const pB = b.promo === "Q" ? 800 : 0;
          return (capB + pB) - (capA + pA);
        });
      }

      function quiescence(state, alpha, beta, maximizing, qDepth, deadline) {
        if (Date.now() > deadline) return evaluateBoard(state);
        const standPat = evaluateBoard(state);
        if (qDepth <= 0) return standPat;

        if (maximizing) {
          if (standPat >= beta) return beta;
          if (alpha < standPat) alpha = standPat;
          const caps = orderMoves(state, getLegalMoves(state).filter(m => state.board[m.toR][m.toC] || m.enPassant || m.promo === "Q"));
          for (let i = 0; i < caps.length; i++) {
            const score = quiescence(applyMove(state, caps[i]), alpha, beta, false, qDepth - 1, deadline);
            if (score > alpha) alpha = score;
            if (alpha >= beta) return beta;
          }
          return alpha;
        } else {
          if (standPat <= alpha) return alpha;
          if (beta > standPat) beta = standPat;
          const caps = orderMoves(state, getLegalMoves(state).filter(m => state.board[m.toR][m.toC] || m.enPassant || m.promo === "Q"));
          for (let i = 0; i < caps.length; i++) {
            const score = quiescence(applyMove(state, caps[i]), alpha, beta, true, qDepth - 1, deadline);
            if (score < beta) beta = score;
            if (beta <= alpha) return alpha;
          }
          return beta;
        }
      }

      function searchBestMove(state, targetDepth, useQSearch = true) {
        const start = Date.now();
        const budget = targetDepth >= 4 ? 1100 : (targetDepth === 3 ? 500 : 250);
        const deadline = start + budget;
        const tt = new Map();

        function alphabeta(st, depth, alpha, beta, maximizing) {
          if (Date.now() > deadline) throw "TIMEOUT";

          const posKey = getPositionKey(st);
          const ttEntry = tt.get(posKey);
          if (ttEntry && ttEntry.depth >= depth) {
            if (ttEntry.flag === "EXACT") return ttEntry.score;
            if (ttEntry.flag === "LOWER" && ttEntry.score > alpha) alpha = ttEntry.score;
            else if (ttEntry.flag === "UPPER" && ttEntry.score < beta) beta = ttEntry.score;
            if (alpha >= beta) return ttEntry.score;
          }

          const moves = getLegalMoves(st);
          if (moves.length === 0) {
            if (isKingInCheck(st.board, st.turn)) return maximizing ? (-100000 - depth) : (100000 + depth);
            return 0;
          }
          if (isInsufficientMaterial(st.board) || st.halfMoveClock >= 100) return 0;
          if (depth === 0) return useQSearch ? quiescence(st, alpha, beta, maximizing, 3, deadline) : evaluateBoard(st);

          orderMoves(st, moves, ttEntry ? ttEntry.bestKey : null);
          const origAlpha = alpha, origBeta = beta;
          let bestVal = maximizing ? -Infinity : Infinity;
          let bestKey = null;

          for (let i = 0; i < moves.length; i++) {
            const m = moves[i];
            if (m.promo && m.promo !== "Q") continue;
            const val = alphabeta(applyMove(st, m), depth - 1, alpha, beta, !maximizing);
            const k = `${m.fromR}${m.fromC}${m.toR}${m.toC}${m.promo || ""}`;
            if (maximizing) {
              if (val > bestVal) { bestVal = val; bestKey = k; }
              if (val > alpha) alpha = val;
            } else {
              if (val < bestVal) { bestVal = val; bestKey = k; }
              if (val < beta) beta = val;
            }
            if (alpha >= beta) break;
          }

          if (tt.size < 40000) {
            let flag = "EXACT";
            if (bestVal <= origAlpha) flag = "UPPER";
            else if (bestVal >= origBeta) flag = "LOWER";
            tt.set(posKey, { depth, score: bestVal, flag, bestKey });
          }
          return bestVal;
        }

        const rootMoves = getLegalMoves(state);
        if (rootMoves.length === 0) return { move: null, score: 0 };

        const maximizing = state.turn === "w";
        let finalMove = rootMoves[0];
        let finalScore = 0;

        for (let d = 1; d <= targetDepth; d++) {
          try {
            let bestScore = maximizing ? -Infinity : Infinity;
            let bestCandidates = [];
            orderMoves(state, rootMoves, `${finalMove.fromR}${finalMove.fromC}${finalMove.toR}${finalMove.toC}${finalMove.promo || ""}`);

            for (let i = 0; i < rootMoves.length; i++) {
              const m = rootMoves[i];
              if (m.promo && m.promo !== "Q") continue;
              const score = alphabeta(applyMove(state, m), d - 1, -Infinity, Infinity, !maximizing);
              if (maximizing) {
                if (score > bestScore) { bestScore = score; bestCandidates = [m]; }
                else if (score === bestScore) bestCandidates.push(m);
              } else {
                if (score < bestScore) { bestScore = score; bestCandidates = [m]; }
                else if (score === bestScore) bestCandidates.push(m);
              }
            }
            finalMove = bestCandidates[Math.floor(Math.random() * bestCandidates.length)];
            finalScore = bestScore;
            if (Math.abs(finalScore) >= 99000) break;
          } catch (e) {
            if (e === "TIMEOUT") break;
            throw e;
          }
        }
        return { move: finalMove, score: finalScore };
      }

      function evaluatePosition(state, depth = 2) {
        const res = searchBestMove(state, depth, true);
        return res.score;
      }

      return {
        cloneState, findKing, isSquareAttacked, isKingInCheck,
        getLegalMoves, applyMove, isInsufficientMaterial, getPositionKey,
        evaluateBoard, searchBestMove, evaluatePosition
      };
    }

    const Engine = createEngineCore();

    // =========================================================================
    // 2. INLINE WEB WORKER (Non-blocking AI + Eval)
    // =========================================================================
    let aiWorker = null;
    const pendingWorkerCalls = new Map();
    let workerMsgId = 1;

    try {
      const workerBlob = new Blob([`
        ${createEngineCore.toString()}
        const Engine = createEngineCore();
        self.onmessage = function(e) {
          const { id, type, state, depth, useQ } = e.data;
          if (type === "search") {
            const res = Engine.searchBestMove(state, depth, useQ);
            self.postMessage({ id, res });
          } else if (type === "eval") {
            const score = Engine.evaluatePosition(state, depth);
            self.postMessage({ id, score });
          }
        };
      `], { type: "application/javascript" });
      aiWorker = new Worker(URL.createObjectURL(workerBlob));
      aiWorker.onmessage = (e) => {
        const { id, res, score } = e.data;
        const resolver = pendingWorkerCalls.get(id);
        if (resolver) {
          pendingWorkerCalls.delete(id);
          resolver(res !== undefined ? res : score);
        }
      };
    } catch (_) {
      aiWorker = null;

    function runEngineTask(payload) {
      if (aiWorker) {
        return new Promise(resolve => {
          const id = workerMsgId++;
          pendingWorkerCalls.set(id, resolve);
          aiWorker.postMessage({ id, ...payload });
        });
      }
      return new Promise(resolve => {
        setTimeout(() => {
          if (payload.type === "search") resolve(Engine.searchBestMove(payload.state, payload.depth, payload.useQ));
          else resolve(Engine.evaluatePosition(payload.state, payload.depth));
        }, 25);
      });
    }

    // =========================================================================

    const FILES = ["a", "b", "c", "d", "e", "f", "g", "h"];
    let audioCtx = null;
    let soundOn = true;

    function playTone(kind) {
      if (!soundOn) return;
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === "suspended") audioCtx.resume();
        const t = audioCtx.currentTime;
        const osc = audioCtx.createOscillator();
        const g = audioCtx.createGain();
        osc.connect(g);
        g.connect(audioCtx.destination);

        if (kind === "capture") {
          osc.type = "triangle";
          osc.frequency.setValueAtTime(240, t);
          osc.frequency.exponentialRampToValueAtTime(65, t + 0.09);
          g.gain.setValueAtTime(0.24, t);
          g.gain.exponentialRampToValueAtTime(0.001, t + 0.09);
          osc.start(t); osc.stop(t + 0.09);
        } else if (kind === "check") {
          osc.type = "sine";
          osc.frequency.setValueAtTime(540, t);
          osc.frequency.exponentialRampToValueAtTime(320, t + 0.14);
          g.gain.setValueAtTime(0.2, t);
          g.gain.exponentialRampToValueAtTime(0.001, t + 0.14);
          osc.start(t); osc.stop(t + 0.14);
        } else if (kind === "castle") {
          osc.type = "sine";
          osc.frequency.setValueAtTime(210, t);
          osc.frequency.setValueAtTime(260, t + 0.05);
          g.gain.setValueAtTime(0.16, t);
          g.gain.exponentialRampToValueAtTime(0.001, t + 0.12);
          osc.start(t); osc.stop(t + 0.12);
        } else if (kind === "gameover") {
          osc.type = "triangle";
          osc.frequency.setValueAtTime(380, t);
          osc.frequency.exponentialRampToValueAtTime(190, t + 0.25);
          g.gain.setValueAtTime(0.22, t);
          g.gain.exponentialRampToValueAtTime(0.001, t + 0.25);
          osc.start(t); osc.stop(t + 0.25);
        } else {
          osc.type = "sine";
          osc.frequency.setValueAtTime(175, t);
          osc.frequency.exponentialRampToValueAtTime(80, t + 0.06);
          g.gain.setValueAtTime(0.16, t);
          g.gain.exponentialRampToValueAtTime(0.001, t + 0.06);
          osc.start(t); osc.stop(t + 0.06);
        }
      } catch (_) {}
    }

    function createInitialState() {
      return {
        board: [
          ["bR","bN","bB","bQ","bK","bB","bN","bR"],
          ["bP","bP","bP","bP","bP","bP","bP","bP"],
          [null,null,null,null,null,null,null,null],
          [null,null,null,null,null,null,null,null],
          [null,null,null,null,null,null,null,null],
          [null,null,null,null,null,null,null,null],
          ["wP","wP","wP","wP","wP","wP","wP","wP"],
          ["wR","wN","wB","wQ","wK","wB","wN","wR"]
        ],
        turn: "w",
        castling: { wK: true, wQ: true, bK: true, bQ: true },
        enPassant: null,
        halfMoveClock: 0,
        fullMove: 1,
        captured: { w: [], b: [] },
        lastMove: null
      };
    }

    function stateToFEN(state) {
      const rows = [];
      for (let r = 0; r < 8; r++) {
        let rowStr = "", empty = 0;
        for (let c = 0; c < 8; c++) {
          const p = state.board[r][c];
          if (!p) { empty++; }
          else {
            if (empty) { rowStr += empty; empty = 0; }
            rowStr += p[0] === "w" ? p[1] : p[1].toLowerCase();
          }
        }
        if (empty) rowStr += empty;
        rows.push(rowStr);
      }
      let cast = "";
      if (state.castling.wK) cast += "K";
      if (state.castling.wQ) cast += "Q";
      if (state.castling.bK) cast += "k";
      if (state.castling.bQ) cast += "q";
      if (!cast) cast = "-";
      const ep = state.enPassant ? FILES[state.enPassant.c] + (8 - state.enPassant.r) : "-";
      return `${rows.join("/")} ${state.turn} ${cast} ${ep} ${state.halfMoveClock} ${state.fullMove}`;
    }

    function parseFEN(fen) {
      const parts = fen.trim().split(/\s+/);
      if (parts.length < 4) throw new Error("Invalid FEN format.");
      const ranks = parts[0].split("/");
      if (ranks.length !== 8) throw new Error("FEN must have 8 ranks.");

      const board = Array.from({ length: 8 }, () => Array(8).fill(null));
      let wKings = 0, bKings = 0;
      for (let r = 0; r < 8; r++) {
        let c = 0;
        for (const ch of ranks[r]) {
          if (/[1-8]/.test(ch)) {
            c += parseInt(ch, 10);
          } else if (/[pnbrqkPNBRQK]/.test(ch)) {
            if (c >= 8) throw new Error("Too many squares in rank.");
            const color = ch === ch.toUpperCase() ? "w" : "b";
            const type = ch.toUpperCase();
            if (type === "K") color === "w" ? wKings++ : bKings++;
            board[r][c++] = color + type;
          } else {
            throw new Error(`Invalid piece char: ${ch}`);
          }
        }
        if (c !== 8) throw new Error("Invalid rank length.");
      }
      if (wKings !== 1 || bKings !== 1) throw new Error("Board must have exactly 1 White King and 1 Black King.");

      const turn = parts[1];
      if (turn !== "w" && turn !== "b") throw new Error("Invalid side to move.");
      if (Engine.isKingInCheck(board, turn === "w" ? "b" : "w")) {
        throw new Error("Illegal position: side not to move is in check.");
      }

      const castStr = parts[2];
      const castling = {
        wK: castStr.includes("K") && board[7][4] === "wK" && board[7][7] === "wR",
        wQ: castStr.includes("Q") && board[7][4] === "wK" && board[7][0] === "wR",
        bK: castStr.includes("k") && board[0][4] === "bK" && board[0][7] === "bR",
        bQ: castStr.includes("q") && board[0][4] === "bK" && board[0][0] === "bR"
      };

      let enPassant = null;
      if (parts[3] !== "-") {
        const fc = FILES.indexOf(parts[3][0]);
        const fr = 8 - parseInt(parts[3][1], 10);
        if (fc < 0 || fr < 0 || fr > 7) throw new Error("Invalid en passant square.");
        enPassant = { r: fr, c: fc };
      }

      return {
        board,
        turn,
        castling,
        enPassant,
        halfMoveClock: parseInt(parts[4] || "0", 10) || 0,
        fullMove: parseInt(parts[5] || "1", 10) || 1,
        captured: { w: [], b: [] },
        lastMove: null
      };
    }

    function formatSAN(prevState, move, nextState, nextLegal) {
      const checkSuffix = Engine.isKingInCheck(nextState.board, nextState.turn) ? (nextLegal.length === 0 ? "#" : "+") : "";
      if (move.castle === "K") return "O-O" + checkSuffix;
      if (move.castle === "Q") return "O-O-O" + checkSuffix;

      const piece = prevState.board[move.fromR][move.fromC];
      const type = piece[1];
      const isCapture = Boolean(prevState.board[move.toR][move.toC]) || move.enPassant;
      const dest = FILES[move.toC] + (8 - move.toR);

      let san = "";
      if (type === "P") {
        if (isCapture) san += FILES[move.fromC] + "x";
        san += dest;
        if (move.promo) san += "=" + move.promo;
      } else {
        san += type;
        const peers = Engine.getLegalMoves(prevState, piece[0]).filter(
          m => prevState.board[m.fromR][m.fromC] === piece && m.toR === move.toR && m.toC === move.toC &&
               (m.fromR !== move.fromR || m.fromC !== move.fromC)
        );
        if (peers.length > 0) {
          const sameFile = peers.some(m => m.fromC === move.fromC);
          const sameRank = peers.some(m => m.fromR === move.fromR);
          if (!sameFile) san += FILES[move.fromC];
          else if (!sameRank) san += (8 - move.fromR);
          else san += FILES[move.fromC] + (8 - move.fromR);
        }
        if (isCapture) san += "x";
        san += dest;
      }
      return san + checkSuffix;
    }
