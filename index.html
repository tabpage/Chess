    function checkEndConditions(nextState, nextLegal) {
      const posKey = Engine.getPositionKey(nextState);
      const cnt = (positionCounts.get(posKey) || 0) + 1;
      positionCounts.set(posKey, cnt);
      if (nextLegal.length === 0) {
        if (Engine.isKingInCheck(nextState.board, nextState.turn)) {
          const w = nextState.turn === "w" ? "Black" : "White";
          endGame(`${w} Wins!`, "Victory by Checkmate", nextState.turn === "w" ? "0-1" : "1-0");
        } else {
          endGame("Draw", "Stalemate — no legal moves", "1/2-1/2");
        }
        return true;
      }
      if (cnt >= 3) { endGame("Draw", "Threefold Repetition", "1/2-1/2"); return true; }
      if (nextState.halfMoveClock >= 100) { endGame("Draw", "50-Move Rule", "1/2-1/2"); return true; }
      if (Engine.isInsufficientMaterial(nextState.board)) { endGame("Draw", "Insufficient Material", "1/2-1/2"); return true; }
      return false;
    }

    function executeMove(move, precomputedEval = null, skipSlideAnim = false) {
      const prevState = moveHistory.length === 0 ? rootState : moveHistory[moveHistory.length - 1].stateAfter;
      const movingColor = prevState.turn;
      const isCap = Boolean(prevState.board[move.toR][move.toC]) || move.enPassant;

      const nextState = Engine.applyMove(prevState, move);
      const nextLegal = Engine.getLegalMoves(nextState);
      const san = formatSAN(prevState, move, nextState, nextLegal);

      if (baseTimeSec > 0) {
        if (!clockStarted) { clockStarted = true; lastTickTime = performance.now(); }
        else clocks[movingColor] += incrementSec;
      }

      const entry = {
        stateBefore: prevState, stateAfter: nextState, san, move,
        evalScore: precomputedEval !== null ? precomputedEval : Engine.evaluateBoard(nextState)
      };

      moveHistory.push(entry);
      viewIndex = moveHistory.length;
      selectedSq = null; selectedLegalMoves = [];
      hintArrow = null; annoSquares.clear(); annoArrows = [];

      const ended = checkEndConditions(nextState, nextLegal);
      const isCheck = Engine.isKingInCheck(nextState.board, nextState.turn);

      if (!ended) {
        if (isCheck) playTone("check");
        else if (move.castle) playTone("castle");
        else if (isCap) playTone("capture");
        else playTone("move");
      }

      spawnLandFX(move.toR, move.toC, flipped, isCap, isCheck);
      if (isCheck) {
        const kPos = Engine.findKing(nextState.board, nextState.turn);
        if (kPos) spawnLandFX(kPos.r, kPos.c, flipped, false, true);
      }

      render(skipSlideAnim ? null : move);
      updateEvalBar(entry.evalScore);
      if (precomputedEval === null && !ended) refreshEvalAsync(nextState, entry);
      if (!ended) maybeTriggerAI();
    }

    function tryBookMove(state) {
      if (parseInt(depthSelect.value, 10) < 3 || moveHistory.length > 10) return null;
      const seq = moveHistory.map(h => h.san.replace(/[+#]/g, "")).join(" ");
      const replies = BOOK_REPLIES[seq];
      if (!replies) return null;
      const legal = Engine.getLegalMoves(state).map(m => ({
        move: m, san: formatSAN(state, m, Engine.applyMove(state, m), []).replace(/[+#]/g, "")
      }));
      const hits = replies.map(r => legal.find(x => x.san === r)).filter(Boolean);
      return hits.length ? hits[Math.floor(Math.random() * hits.length)].move : null;
    }

    async function maybeTriggerAI() {
      const aiColor = getAIColor();
      const liveState = moveHistory.length === 0 ? rootState : moveHistory[moveHistory.length - 1].stateAfter;
      if (gameOverInfo || !aiColor || liveState.turn !== aiColor || aiBusy) return;

      aiBusy = true;
      const sid = gameSessionId;
      renderStatus();

      const bookMove = tryBookMove(liveState);
      let chosen = bookMove, evalScore = null;
      if (bookMove) await new Promise(r => setTimeout(r, 220));
      else {
        const depth = parseInt(depthSelect.value, 10);
        const res = await runEngineTask({ type: "search", state: liveState, depth, useQ: depth >= 2 });
        chosen = res.move; evalScore = res.score;
      }

      if (sid !== gameSessionId) { aiBusy = false; return; }
      aiBusy = false;
      if (chosen) {
        executeMove(chosen, evalScore);
        if (premove && !gameOverInfo) {
          const pm = premove; premove = null;
          const post = getActiveState();
          const match = Engine.getLegalMoves(post).find(
            m => m.fromR === pm.fromR && m.fromC === pm.fromC && m.toR === pm.toR && m.toC === pm.toC && (!m.promo || m.promo === "Q")
          );
          if (match) setTimeout(() => executeMove(match), 70);
          else renderBoard();
        }
      }
    }

    // =========================================================================
    // 9. UNIFIED POINTER DRAG + CLICK + RIGHT-CLICK ARROWS
    // =========================================================================
    function openPromoModal(moves) {
      pendingPromo = moves;
      const color = getActiveState().turn;
      promoChoices.innerHTML = "";
      for (const t of ["Q", "R", "B", "N"]) {
        const btn = document.createElement("button");
        btn.className = "promo-btn";
        btn.innerHTML = getPieceSVG(color + t);
        btn.onclick = () => {
          const chosen = pendingPromo.find(m => m.promo === t);
          pendingPromo = null;
          promoOverlay.classList.remove("open");
          if (chosen) executeMove(chosen);
        };
        promoChoices.appendChild(btn);
      }
      promoOverlay.classList.add("open");
    }

    function handleSquareAction(r, c, skipSlide = false) {
      if (pendingPromo || gameOverInfo) return;
      annoSquares.clear(); annoArrows = []; hintArrow = null;
      if (!isLiveView()) { renderArrows(); renderBoard(); return; }

      const state = getActiveState(), aiColor = getAIColor();
      if (aiColor && state.turn === aiColor) {
        const humanCol = aiColor === "w" ? "b" : "w";
        if (selectedSq) {
          if (selectedSq.r !== r || selectedSq.c !== c) premove = { fromR: selectedSq.r, fromC: selectedSq.c, toR: r, toC: c };
          selectedSq = null; selectedLegalMoves = [];
        } else if (state.board[r][c] && state.board[r][c][0] === humanCol) {
          selectedSq = { r, c }; premove = null;
        } else premove = null;
        renderBoard(); renderArrows(); return;
      }

      if (!isHumanTurn()) return;
      if (selectedSq) {
        const matches = selectedLegalMoves.filter(m => m.toR === r && m.toC === c);
        if (matches.length > 0) {
          if (matches.length > 1 && matches[0].promo) openPromoModal(matches);
          else executeMove(matches[0], null, skipSlide);
          return;
        }
      }

      const piece = state.board[r][c];
      if (piece && piece[0] === state.turn) {
        if (selectedSq && selectedSq.r === r && selectedSq.c === c) { selectedSq = null; selectedLegalMoves = []; }
        else { selectedSq = { r, c }; selectedLegalMoves = Engine.getLegalMoves(state).filter(m => m.fromR === r && m.fromC === c); }
      } else { selectedSq = null; selectedLegalMoves = []; }
      renderBoard(); renderArrows();
    }

    function squareFromClientPoint(x, y) {
      const el = document.elementFromPoint(x, y);
      const sq = el ? el.closest(".square") : null;
      if (!sq) return null;
      return { r: parseInt(sq.dataset.r, 10), c: parseInt(sq.dataset.c, 10), el: sq };
    }

    boardStage.addEventListener("contextmenu", e => e.preventDefault());
    boardStage.addEventListener("mousedown", e => {
      if (e.button === 2) rightDragStart = squareFromClientPoint(e.clientX, e.clientY);
    });
    boardStage.addEventListener("mouseup", e => {
      if (e.button === 2 && rightDragStart) {
        const end = squareFromClientPoint(e.clientX, e.clientY);
        if (end) {
          if (end.r === rightDragStart.r && end.c === rightDragStart.c) {
            const k = `${end.r},${end.c}`;
            if (annoSquares.has(k)) annoSquares.delete(k); else annoSquares.add(k);
            renderBoard();
          } else {
            const idx = annoArrows.findIndex(a => a.fromR === rightDragStart.r && a.fromC === rightDragStart.c && a.toR === end.r && a.toC === end.c);
            if (idx >= 0) annoArrows.splice(idx, 1);
            else annoArrows.push({ fromR: rightDragStart.r, fromC: rightDragStart.c, toR: end.r, toC: end.c, color: "orange" });
            renderArrows();
          }
        }
        rightDragStart = null;
      }
    });

    window.addEventListener("pointermove", (e) => {
      if (!dragState) return;
      const dist = Math.hypot(e.clientX - dragState.startX, e.clientY - dragState.startY);
      if (!dragState.active && dist > 6) {
        dragState.active = true;
        selectedSq = { r: dragState.r, c: dragState.c };
        selectedLegalMoves = isHumanTurn() ? Engine.getLegalMoves(getActiveState()).filter(m => m.fromR === dragState.r && m.fromC === dragState.c) : [];
        renderHighlightsOnly();
        dragState.originEl.style.opacity = "0.15";
        if (dragState.shadowEl) dragState.shadowEl.style.opacity = "0";
        dragGhost.innerHTML = getPieceSVG(dragState.pieceCode);
        dragGhost.style.width = `${dragState.size * 1.16}px`;
        dragGhost.style.height = `${dragState.size * 1.16}px`;
        dragGhost.style.display = "block";
      }
      if (dragState.active) {
        const half = (dragState.size * 1.16) / 2;
        dragGhost.style.transform = `translate3d(${e.clientX - half}px, ${e.clientY - half}px, 0)`;
        boardEl.querySelectorAll(".square.drag-hover").forEach(s => s.classList.remove("drag-hover"));
        const target = squareFromClientPoint(e.clientX, e.clientY);
        if (target && selectedLegalMoves.some(m => m.toR === target.r && m.toC === target.c)) {
          target.el.classList.add("drag-hover");
        }
      }
    });

    window.addEventListener("pointerup", (e) => {
      if (!dragState) return;
      const wasActive = dragState.active;
      const origR = dragState.r, origC = dragState.c;
      dragGhost.style.display = "none";
      boardEl.querySelectorAll(".square.drag-hover").forEach(s => s.classList.remove("drag-hover"));
      if (dragState.originEl) dragState.originEl.style.opacity = "1";
      if (dragState.shadowEl) dragState.shadowEl.style.opacity = "1";
      dragState = null;

      if (wasActive) {
        const target = squareFromClientPoint(e.clientX, e.clientY);
        if (target && (target.r !== origR || target.c !== origC)) {
          handleSquareAction(target.r, target.c, true);
        }
      }
    });

    // =========================================================================
    // 10. RENDERING
    // =========================================================================
    function renderBezelCoords() {
      const top = document.getElementById("coords-top"), bot = document.getElementById("coords-bottom");
      const left = document.getElementById("coords-left"), right = document.getElementById("coords-right");
      const files = flipped ? [...FILES].reverse() : FILES;
      const ranks = flipped ? [1,2,3,4,5,6,7,8] : [8,7,6,5,4,3,2,1];

      top.innerHTML = bot.innerHTML = files.map(f => `<span class="bezel-lbl">${f.toUpperCase()}</span>`).join("");
      left.innerHTML = right.innerHTML = ranks.map(r => `<span class="bezel-lbl">${r}</span>`).join("");
    }

    function renderArrows() {
      const defs = arrowLayer.querySelector("defs").outerHTML;
      let content = defs;
      const all = [...annoArrows];
      if (hintArrow) all.push(hintArrow);

      for (const a of all) {
        const p1 = squareCenter(a.fromR, a.fromC, flipped), p2 = squareCenter(a.toR, a.toC, flipped);
        const dx = p2.x - p1.x, dy = p2.y - p1.y, len = Math.hypot(dx, dy) || 1;
        const ux = dx / len, uy = dy / len;
        const sx = p1.x + ux * 16, sy = p1.y + uy * 16, ex = p2.x - ux * 20, ey = p2.y - uy * 20;
        const col = a.color === "cyan" ? "rgba(72, 202, 248, 0.92)" : "rgba(245, 179, 66, 0.88)";
        const marker = a.color === "cyan" ? "url(#arrow-cyan)" : "url(#arrow-orange)";
        content += `<line x1="${sx}" y1="${sy}" x2="${ex}" y2="${ey}" stroke="${col}" stroke-width="14" stroke-linecap="round" marker-end="${marker}" />`;
      }
      arrowLayer.innerHTML = content;
    }

    function renderBoard(animateMove = null) {
      renderBezelCoords();
      const state = getActiveState();
      boardEl.innerHTML = "";
      const inCheck = Engine.isKingInCheck(state.board, state.turn);
      const kingPos = inCheck ? Engine.findKing(state.board, state.turn) : null;
      let animatedPieceEl = null;

      for (let vr = 0; vr < 8; vr++) {
        for (let vc = 0; vc < 8; vc++) {
          const r = flipped ? 7 - vr : vr, c = flipped ? 7 - vc : vc;
          const sq = document.createElement("div");
          sq.className = `square ${(r + c) % 2 === 0 ? "light" : "dark"}`;
          sq.dataset.r = r; sq.dataset.c = c;

          if (state.lastMove && ((state.lastMove.fromR === r && state.lastMove.fromC === c) || (state.lastMove.toR === r && state.lastMove.toC === c))) {
            sq.classList.add("last-move");
          }
          if (selectedSq && selectedSq.r === r && selectedSq.c === c) sq.classList.add("selected");
          if (premove && ((premove.fromR === r && premove.fromC === c) || (premove.toR === r && premove.toC === c))) sq.classList.add("premove");
          if (annoSquares.has(`${r},${c}`)) sq.classList.add("anno-sq");
          if (kingPos && kingPos.r === r && kingPos.c === c) sq.classList.add("in-check");

          if (selectedLegalMoves.some(m => m.toR === r && m.toC === c)) {
            const dot = document.createElement("div");
            const isCap = Boolean(state.board[r][c]) || selectedLegalMoves.some(m => m.toR === r && m.toC === c && m.enPassant);
            dot.className = isCap ? "legal-ring" : "legal-dot";
            sq.appendChild(dot);
          }

          const piece = state.board[r][c];
          if (piece) {
            const shadow = document.createElement("div");
            shadow.className = "piece-shadow";
            sq.appendChild(shadow);

            const pEl = document.createElement("div");
            pEl.className = "piece";
            pEl.innerHTML = getPieceSVG(piece);

            const canInteract = isLiveView() && !gameOverInfo &&
              ((isHumanTurn() && piece[0] === state.turn) || (getAIColor() && piece[0] !== getAIColor()));
            if (canInteract) {
              pEl.addEventListener("pointerdown", (e) => {
                if (e.button !== 0) return;
                const rect = pEl.getBoundingClientRect();
                dragState = {
                  r, c, startX: e.clientX, startY: e.clientY,
                  active: false, pieceCode: piece, size: rect.width,
                  originEl: pEl, shadowEl: shadow
                };
              });
            }

            if (animateMove && animateMove.toR === r && animateMove.toC === c) animatedPieceEl = pEl;
            sq.appendChild(pEl);
          }

          sq.addEventListener("click", (e) => { if (e.button === 0) handleSquareAction(r, c); });
          boardEl.appendChild(sq);
        }
      }

      if (animatedPieceEl && animateMove) {
        const fvr = flipped ? 7 - animateMove.fromR : animateMove.fromR;
        const fvc = flipped ? 7 - animateMove.fromC : animateMove.fromC;
        const tvr = flipped ? 7 - animateMove.toR : animateMove.toR;
        const tvc = flipped ? 7 - animateMove.toC : animateMove.toC;
        const dx = (fvc - tvc) * 114, dy = (fvr - tvr) * 114;
        animatedPieceEl.style.transition = "none";
        animatedPieceEl.style.transform = `translate(${dx}%, ${dy}%)`;
        animatedPieceEl.getBoundingClientRect();
        animatedPieceEl.style.transition = "transform 165ms cubic-bezier(0.22, 1, 0.36, 1)";
        animatedPieceEl.style.transform = "";
      }
    }

    function renderHighlightsOnly() {
      boardEl.querySelectorAll(".square").forEach(sq => {
        const r = parseInt(sq.dataset.r, 10), c = parseInt(sq.dataset.c, 10);
        sq.classList.toggle("selected", selectedSq && selectedSq.r === r && selectedSq.c === c);
        sq.querySelectorAll(".legal-dot, .legal-ring").forEach(n => n.remove());
        if (selectedLegalMoves.some(m => m.toR === r && m.toC === c)) {
          const dot = document.createElement("div");
          const isCap = Boolean(getActiveState().board[r][c]) || selectedLegalMoves.some(m => m.toR === r && m.toC === c && m.enPassant);
          dot.className = isCap ? "legal-ring" : "legal-dot";
          sq.appendChild(dot);
        }
      });
    }

    function renderPlayers() {
      const state = getActiveState();
      const topC = flipped ? "w" : "b", botC = flipped ? "b" : "w", aiCol = getAIColor();
      const lbl = c => (!aiCol ? (c === "w" ? "White" : "Black") : (c === aiCol ? `${c === "w" ? "White" : "Black"} • Engine` : `${c === "w" ? "White" : "Black"} • You`));

      document.getElementById("top-name").textContent = lbl(topC);
      document.getElementById("bottom-name").textContent = lbl(botC);
      document.getElementById("top-avatar").className = `avatar ${topC}`;
      document.getElementById("top-avatar").textContent = topC === "w" ? "♔" : "♚";
      document.getElementById("bottom-avatar").className = `avatar ${botC}`;
      document.getElementById("bottom-avatar").textContent = botC === "w" ? "♔" : "♚";

      document.getElementById("top-dot").classList.toggle("active", !gameOverInfo && isLiveView() && state.turn === topC);
      document.getElementById("bottom-dot").classList.toggle("active", !gameOverInfo && isLiveView() && state.turn === botC);

      const vals = { P: 1, N: 3, B: 3, R: 5, Q: 9 };
      const sum = arr => arr.reduce((a, p) => a + (vals[p[1]] || 0), 0);
      const wMat = sum(state.captured.w), bMat = sum(state.captured.b);

      const drawCap = (id, c) => {
        const el = document.getElementById(id);
        const sorted = [...state.captured[c]].sort((a, b) => vals[b[1]] - vals[a[1]]);
        el.innerHTML = sorted.map(p => `<span class="cap-icon">${getPieceSVG(p)}</span>`).join("");
        const diff = c === "w" ? wMat - bMat : bMat - wMat;
        if (diff > 0) el.innerHTML += `<span class="mat-diff">+${diff}</span>`;
      };
      drawCap("top-captured", topC); drawCap("bottom-captured", botC);
    }

    function renderStatus() {
      const state = getActiveState();
      statusBox.className = "status-box";
      if (!isLiveView()) { statusBox.classList.add("review"); statusText.textContent = `Reviewing move ${viewIndex} of ${moveHistory.length}`; }
      else if (gameOverInfo) { statusBox.classList.add("gameover"); statusText.textContent = `${gameOverInfo.title} — ${gameOverInfo.subtitle}`; }
      else if (aiBusy) { statusText.textContent = "Engine thinking..."; }
      else {
        const side = state.turn === "w" ? "White" : "Black";
        if (Engine.isKingInCheck(state.board, state.turn)) { statusBox.classList.add("check"); statusText.textContent = `${side} is in Check!`; }
        else statusText.textContent = `${side} to move`;
      }
      document.getElementById("opening-name").textContent = detectOpening(moveHistory.slice(0, viewIndex).map(h => h.san));
      document.getElementById("ply-counter").textContent = `${moveHistory.length} ply`;
    }

    function renderHistory() {
      moveListEl.innerHTML = "";
      for (let i = 0; i < moveHistory.length; i += 2) {
        const row = document.createElement("div"); row.className = "move-row";
        const num = document.createElement("span"); num.className = "move-num"; num.textContent = `${Math.floor(i / 2) + 1}.`;
        row.appendChild(num);
        for (let off = 0; off < 2; off++) {
          const idx = i + off, cell = document.createElement("span");
          if (idx < moveHistory.length) {
            cell.className = "move-cell" + (viewIndex === idx + 1 ? " active" : "");
            cell.textContent = moveHistory[idx].san;
            cell.onclick = () => jumpToHistory(idx + 1);
          }
          row.appendChild(cell);
        }
        moveListEl.appendChild(row);
      }
      if (isLiveView()) moveListEl.scrollTop = moveListEl.scrollHeight;
      else { const act = moveListEl.querySelector(".move-cell.active"); if (act) act.scrollIntoView({ block: "nearest" }); }

      document.getElementById("undo-btn").disabled = moveHistory.length === 0 || aiBusy;
      document.getElementById("resign-btn").disabled = Boolean(gameOverInfo);
      document.getElementById("hint-btn").disabled = !isHumanTurn() || aiBusy;
      document.getElementById("nav-start").disabled = viewIndex === 0;
      document.getElementById("nav-prev").disabled = viewIndex === 0;
      document.getElementById("nav-next").disabled = isLiveView();
      document.getElementById("nav-end").disabled = isLiveView();
    }

    function render(animateMove = null) {
      renderBoard(animateMove);
      renderArrows();
      renderPlayers();
      renderClocks();
      renderStatus();
      renderHistory();
    }

    function jumpToHistory(idx) {
      viewIndex = Math.max(0, Math.min(moveHistory.length, idx));
      selectedSq = null; selectedLegalMoves = []; hintArrow = null;
      render();
      updateEvalBar(viewIndex === 0 ? Engine.evaluateBoard(rootState) : moveHistory[viewIndex - 1].evalScore);
    }

    // =========================================================================
    // 11. UI BINDINGS & STARTUP
    // =========================================================================
    function startNewGame(customRoot = null) {
      gameSessionId++;
      aiBusy = false; pendingPromo = null; premove = null; dragState = null;
      promoOverlay.classList.remove("open"); goOverlay.classList.remove("open");

      rootState = customRoot || createInitialState();
      moveHistory = []; viewIndex = 0;
      selectedSq = null; selectedLegalMoves = [];
      gameOverInfo = null; annoSquares.clear(); annoArrows = []; hintArrow = null;

      positionCounts = new Map();
      positionCounts.set(Engine.getPositionKey(rootState), 1);

      const [bTime, inc] = timeSelect.value.split(",").map(Number);
      baseTimeSec = bTime; incrementSec = inc;
      clocks = { w: bTime, b: bTime }; clockStarted = false;
      startClockTicker();

      const aiCol = getAIColor();
      document.getElementById("depth-field").style.display = aiCol ? "flex" : "none";
      flipped = aiCol === "w";

      updateEvalBar(Engine.evaluateBoard(rootState));
      render();
      maybeTriggerAI();
    }

    document.getElementById("new-game-btn").onclick = () => startNewGame();
    document.getElementById("go-rematch").onclick = () => startNewGame();
    document.getElementById("go-review").onclick = () => goOverlay.classList.remove("open");
    modeSelect.onchange = () => startNewGame();
    timeSelect.onchange = () => startNewGame();
    boardThemeSelect.onchange = () => applyBoardTheme(boardThemeSelect.value);
    pieceThemeSelect.onchange = () => applyPieceTheme(pieceThemeSelect.value);

    document.getElementById("view-btn").onclick = () => {
      const is3D = document.body.classList.toggle("view-3d");
      document.getElementById("view-btn").textContent = is3D ? "2D" : "2.5D";
    };

    document.getElementById("flip-btn").onclick = () => {
      flipped = !flipped;
      updateEvalBar(viewIndex === 0 ? Engine.evaluateBoard(rootState) : moveHistory[viewIndex - 1].evalScore);
      render();
    };

    document.getElementById("undo-btn").onclick = () => {
      if (moveHistory.length === 0 || aiBusy || pendingPromo) return;
      gameSessionId++;
      const aiCol = getAIColor(), liveState = moveHistory[moveHistory.length - 1].stateAfter;
      const popOne = () => {
        const rem = moveHistory.pop();
        if (rem) {
          const k = Engine.getPositionKey(rem.stateAfter);
          positionCounts.set(k, Math.max(0, (positionCounts.get(k) || 1) - 1));
        }
      };
      if (aiCol && liveState.turn !== aiCol && moveHistory.length >= 2) popOne();
      popOne();
      viewIndex = moveHistory.length; gameOverInfo = null;
      goOverlay.classList.remove("open");
      selectedSq = null; selectedLegalMoves = []; hintArrow = null; premove = null;
      if (baseTimeSec > 0 && !clockInterval) startClockTicker();
      updateEvalBar(viewIndex === 0 ? Engine.evaluateBoard(rootState) : moveHistory[viewIndex - 1].evalScore);
      render(); maybeTriggerAI();
    };

    document.getElementById("resign-btn").onclick = () => {
      if (gameOverInfo) return;
      const liveState = moveHistory.length === 0 ? rootState : moveHistory[moveHistory.length - 1].stateAfter;
      const loser = liveState.turn === "w" ? "White" : "Black", winner = liveState.turn === "w" ? "Black" : "White";
      endGame(`${winner} Wins!`, `${loser} resigned`, liveState.turn === "w" ? "0-1" : "1-0");
    };

    document.getElementById("hint-btn").onclick = async () => {
      if (!isHumanTurn() || aiBusy) return;
      const btn = document.getElementById("hint-btn");
      btn.disabled = true; btn.textContent = "⏳...";
      const sid = gameSessionId;
      const res = await runEngineTask({ type: "search", state: getActiveState(), depth: 3, useQ: true });
      btn.textContent = "💡 Hint"; btn.disabled = false;
      if (sid !== gameSessionId || !res.move) return;
      hintArrow = { fromR: res.move.fromR, fromC: res.move.fromC, toR: res.move.toR, toC: res.move.toC, color: "cyan" };
      renderArrows();
    };

    document.getElementById("sound-btn").onclick = () => {
      soundOn = !soundOn;
      document.getElementById("sound-btn").textContent = soundOn ? "🔊" : "🔇";
    };

    document.getElementById("nav-start").onclick = () => jumpToHistory(0);
    document.getElementById("nav-prev").onclick  = () => jumpToHistory(viewIndex - 1);
    document.getElementById("nav-next").onclick  = () => jumpToHistory(viewIndex + 1);
    document.getElementById("nav-end").onclick   = () => jumpToHistory(moveHistory.length);

    document.addEventListener("keydown", (e) => {
      if (document.getElementById("pgn-modal").classList.contains("open")) return;
      if (e.key === "ArrowLeft") jumpToHistory(viewIndex - 1);
      else if (e.key === "ArrowRight") jumpToHistory(viewIndex + 1);
      else if (e.key === "Home") jumpToHistory(0);
      else if (e.key === "End") jumpToHistory(moveHistory.length);
      else if (e.key.toLowerCase() === "f") { flipped = !flipped; render(); }
    });

    const pgnModal = document.getElementById("pgn-modal"), fenInput = document.getElementById("fen-input"),
          fenError = document.getElementById("fen-error"), pgnOutput = document.getElementById("pgn-output");

    function buildPGN() {
      const opening = detectOpening(moveHistory.map(h => h.san)), res = gameOverInfo ? gameOverInfo.resultTag : "*";
      const aiCol = getAIColor();
      let hdr = `[Event "Grandmaster Chess Studio"]\n[White "${aiCol === "w" ? "Engine" : "Player 1"}"]\n[Black "${aiCol === "b" ? "Engine" : (aiCol ? "Player 1" : "Player 2")}"]\n[Opening "${opening}"]\n[Result "${res}"]\n`;
      const startFen = stateToFEN(rootState);
      if (startFen !== "rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR w KQkq - 0 1") hdr += `[SetUp "1"]\n[FEN "${startFen}"]\n`;
      let body = "";
      for (let i = 0; i < moveHistory.length; i += 2) {
        body += `${Math.floor(i / 2) + 1}. ${moveHistory[i].san} `;
        if (moveHistory[i + 1]) body += `${moveHistory[i + 1].san} `;
      }
      return `${hdr}\n${body.trim()} ${res}`.trim();
    }

    document.getElementById("pgn-btn").onclick = () => {
      fenError.textContent = "";
      fenInput.value = stateToFEN(getActiveState());
      pgnOutput.value = buildPGN();
      pgnModal.classList.add("open");
    };
    document.getElementById("close-pgn-btn").onclick = () => pgnModal.classList.remove("open");
    document.getElementById("load-fen-btn").onclick = () => {
      try { const p = parseFEN(fenInput.value); fenError.textContent = ""; pgnModal.classList.remove("open"); startNewGame(p); }
      catch (err) { fenError.textContent = err.message; }
    };
    document.getElementById("copy-fen-btn").onclick = () => {
      navigator.clipboard?.writeText(fenInput.value);
      const b = document.getElementById("copy-fen-btn"); b.textContent = "Copied!";
      setTimeout(() => b.textContent = "Copy", 1200);
    };
    document.getElementById("copy-pgn-btn").onclick = () => {
      navigator.clipboard?.writeText(pgnOutput.value);
      const b = document.getElementById("copy-pgn-btn"); b.textContent = "Copied PGN!";
      setTimeout(() => b.textContent = "Copy PGN", 1200);
    };

    // Init Materials & Boot
    applyBoardTheme("walnut");
    applyPieceTheme("ivory");
    startNewGame();
  </script>
</body>
</html>
