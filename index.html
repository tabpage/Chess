<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Grandmaster Chess Studio — Luxury Edition</title>
  <style>
    :root {
      --bg-core: #0b0d11;
      --glass: rgba(22, 25, 33, 0.78);
      --glass-2: rgba(31, 36, 48, 0.85);
      --border-glass: rgba(255, 255, 255, 0.09);
      --border-highlight: rgba(255, 255, 255, 0.16);
      --text: #f3f5f8;
      --muted: #939bb0;
      --accent: #8ab856;
      --accent-glow: rgba(138, 184, 86, 0.45);
      --gold: #d9b25f;
      --danger: #f05454;
      --warn: #f5b942;
      --frame-bg: #2a1a12;
      --frame-trim: rgba(217, 178, 95, 0.48);
      --coord-color: #d9c39e;
      --tex-light: none;
      --tex-dark: none;
      --tex-frame: none;
      --ambient-hue: rgba(217, 178, 95, 0.08);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, Inter, sans-serif;
      background:
        radial-gradient(ellipse 900px 600px at 38% 48%, var(--ambient-hue), transparent 70%),
        radial-gradient(circle at 80% 15%, rgba(74, 108, 179, 0.09), transparent 55%),
        linear-gradient(160deg, #10131a 0%, var(--bg-core) 65%, #07080b 100%);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 18px;
      overflow-x: hidden;
      transition: background 0.6s ease;
    }

    .studio {
      display: grid;
      grid-template-columns: 30px minmax(310px, 610px) 380px;
      gap: 18px;
      width: 100%;
      max-width: 1070px;
      align-items: stretch;
    }

    /* Evaluation Bar */
    .eval-col {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 64px 0;
    }

    .eval-bar {
      position: relative;
      width: 24px;
      flex: 1;
      background: linear-gradient(180deg, #181b22, #232732);
      border-radius: 99px;
      overflow: hidden;
      border: 1px solid var(--border-highlight);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.6), inset 0 0 8px rgba(0,0,0,0.7);
    }

    .eval-fill {
      position: absolute;
      left: 0; right: 0; bottom: 0;
      height: 50%;
      background: linear-gradient(180deg, #ffffff 0%, #e5e8ef 100%);
      box-shadow: 0 0 12px rgba(255, 255, 255, 0.35);
      transition: height 0.55s cubic-bezier(0.22, 1, 0.36, 1);
    }
    .eval-bar.flipped .eval-fill { bottom: auto; top: 0; }

    .eval-label {
      position: absolute;
      left: 0; right: 0;
      text-align: center;
      font-size: 9.5px;
      font-weight: 800;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      pointer-events: none;
      z-index: 2;
      padding: 6px 0;
    }
    .eval-label.top { top: 2px; color: #f2f4f8; }
    .eval-label.bottom { bottom: 2px; color: #16181d; }

    /* Center Stage */
    .board-col {
      display: flex;
      flex-direction: column;
      gap: 10px;
      perspective: 1200px;
    }

    .player-card {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--glass);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--border-glass);
      border-top-color: var(--border-highlight);
      border-radius: 10px;
      padding: 8px 14px;
      min-height: 52px;
      gap: 10px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
    }

    .player-meta { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
    .player-title { display: flex; align-items: center; gap: 8px; font-weight: 600; font-size: 0.92rem; }

    .avatar {
      width: 24px; height: 24px;
      border-radius: 6px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      box-shadow: inset 0 1px 2px rgba(255,255,255,0.25), 0 2px 5px rgba(0,0,0,0.4);
    }
    .avatar.w { background: linear-gradient(145deg, #fffdf8, #d8ceb8); color: #241b12; }
    .avatar.b { background: linear-gradient(145deg, #333844, #14161c); color: #f2f4f8; border: 1px solid rgba(255,255,255,0.12); }

    .turn-pill {
      width: 8px; height: 8px; border-radius: 50%;
      background: rgba(255,255,255,0.12);
      transition: all 0.25s;
    }
    .turn-pill.active {
      background: var(--accent);
      box-shadow: 0 0 10px var(--accent), 0 0 20px var(--accent-glow);
    }

    .captured-strip { display: flex; align-items: center; flex-wrap: wrap; min-height: 18px; }
    .cap-icon { width: 18px; height: 18px; display: inline-flex; margin-right: -3px; filter: drop-shadow(0 1px 2px rgba(0,0,0,0.5)); }
    .mat-diff { font-size: 0.76rem; color: var(--gold); font-weight: 700; margin-left: 7px; }

    .clock {
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 1.12rem;
      font-weight: 800;
      background: rgba(12, 14, 18, 0.75);
      border: 1px solid var(--border-glass);
      padding: 6px 13px;
      border-radius: 7px;
      min-width: 90px;
      text-align: center;
      color: var(--muted);
      letter-spacing: 0.5px;
      box-shadow: inset 0 2px 6px rgba(0,0,0,0.5);
      transition: all 0.2s;
    }
    .clock.active {
      color: #ffffff;
      border-color: rgba(138, 184, 86, 0.65);
      background: linear-gradient(180deg, rgba(44, 58, 36, 0.85), rgba(22, 28, 20, 0.9));
      box-shadow: 0 0 14px rgba(138, 184, 86, 0.2), inset 0 1px 2px rgba(255,255,255,0.1);
    }
    .clock.low {
      color: #ff9c9c;
      border-color: rgba(240, 84, 84, 0.8);
      background: linear-gradient(180deg, rgba(74, 24, 28, 0.9), rgba(38, 14, 16, 0.95));
      animation: pulseClock 0.9s infinite alternate;
    }
    .clock.hidden { display: none; }
    @keyframes pulseClock { from { opacity: 0.85; } to { opacity: 1; box-shadow: 0 0 16px rgba(240,84,84,0.45); } }

    /* Physical Luxury Board Frame */
    .board-bezel {
      position: relative;
      width: 100%;
      aspect-ratio: 1 / 1;
      padding: 24px;
      border-radius: 12px;
      background-color: var(--frame-bg);
      background-image:
        linear-gradient(145deg, rgba(255,255,255,0.12) 0%, rgba(255,255,255,0) 35%, rgba(0,0,0,0.35) 100%),
        var(--tex-frame);
      background-size: cover;
      box-shadow:
        0 24px 55px rgba(0, 0, 0, 0.78),
        0 4px 12px rgba(0, 0, 0, 0.5),
        inset 0 1px 2px rgba(255, 255, 255, 0.24),
        inset 0 -3px 6px rgba(0, 0, 0, 0.65);
      border: 1px solid rgba(255, 255, 255, 0.12);
      transition: transform 0.55s cubic-bezier(0.22, 1, 0.36, 1), box-shadow 0.55s ease;
      transform-style: preserve-3d;
      user-select: none;
      -webkit-user-select: none;
    }

    body.view-3d .board-bezel {
      transform: rotateX(22deg) scale(0.97);
      box-shadow:
        0 42px 70px rgba(0, 0, 0, 0.88),
        0 14px 20px rgba(0, 0, 0, 0.65),
        inset 0 2px 3px rgba(255, 255, 255, 0.26),
        inset 0 -8px 14px rgba(0, 0, 0, 0.75);
    }

    /* Brass Inlay & Engraved Bezel Coordinates */
    .bezel-coords-top, .bezel-coords-bottom {
      position: absolute;
      left: 24px; right: 24px;
      height: 24px;
      display: grid;
      grid-template-columns: repeat(8, 1fr);
      align-items: center;
      text-align: center;
      pointer-events: none;
    }
    .bezel-coords-top { top: 0; }
    .bezel-coords-bottom { bottom: 0; }

    .bezel-coords-left, .bezel-coords-right {
      position: absolute;
      top: 24px; bottom: 24px;
      width: 24px;
      display: grid;
      grid-template-rows: repeat(8, 1fr);
      align-items: center;
      text-align: center;
      pointer-events: none;
    }
    .bezel-coords-left { left: 0; }
    .bezel-coords-right { right: 0; }

    .bezel-lbl {
      font-size: 10.5px;
      font-weight: 700;
      letter-spacing: 0.5px;
      color: var(--coord-color);
      text-shadow: 0 -1px 1px rgba(0, 0, 0, 0.7), 0 1px 0 rgba(255, 255, 255, 0.14);
      opacity: 0.9;
    }

    .board-stage {
      position: relative;
      width: 100%;
      height: 100%;
      border-radius: 3px;
      overflow: hidden;
      border: 1.5px solid var(--frame-trim);
      box-shadow:
        0 0 0 1px rgba(0, 0, 0, 0.65),
        inset 0 0 14px rgba(0, 0, 0, 0.45);
      transform-style: preserve-3d;
    }

    /* Overhead Studio Spotlight Overlay */
    .board-stage::after {
      content: "";
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at 38% 32%, rgba(255, 255, 255, 0.08) 0%, transparent 55%, rgba(0, 0, 0, 0.2) 100%);
      pointer-events: none;
      z-index: 7;
    }

    .board {
      display: grid;
      grid-template-columns: repeat(8, 1fr);
      grid-template-rows: repeat(8, 1fr);
      width: 100%;
      height: 100%;
      transform-style: preserve-3d;
    }

    .square {
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      background-size: cover;
      transform-style: preserve-3d;
    }

    .square.light { background-image: var(--tex-light); }
    .square.dark  { background-image: var(--tex-dark); }

    .square.last-move::before,
    .square.selected::before,
    .square.premove::before,
    .square.anno-sq::before,
    .square.drag-hover::before {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 1;
    }

    .square.last-move::before {
      background: linear-gradient(135deg, rgba(250, 214, 90, 0.42), rgba(235, 185, 50, 0.28));
      box-shadow: inset 0 0 10px rgba(255, 225, 110, 0.35);
    }

    .square.selected::before {
      background: radial-gradient(circle, rgba(164, 219, 94, 0.62) 10%, rgba(122, 178, 62, 0.44) 100%);
      box-shadow: inset 0 0 12px rgba(210, 255, 140, 0.5);
    }

    .square.premove::before {
      background: rgba(86, 142, 245, 0.48);
      box-shadow: inset 0 0 12px rgba(130, 180, 255, 0.55);
    }

    .square.drag-hover::before {
      box-shadow: inset 0 0 0 3px rgba(255, 255, 255, 0.78);
      background: rgba(255, 255, 255, 0.14);
      z-index: 5;
    }

    .square.anno-sq::before {
      background: radial-gradient(circle, rgba(242, 85, 85, 0.65) 0%, rgba(210, 45, 45, 0.42) 100%);
      box-shadow: inset 0 0 0 2px rgba(255, 120, 120, 0.8);
      z-index: 4;
    }

    .square.in-check::after {
      content: "";
      position: absolute;
      inset: 0;
      background: radial-gradient(circle, rgba(255, 45, 45, 0.92) 0%, rgba(195, 20, 20, 0.65) 58%, transparent 100%);
      pointer-events: none;
      z-index: 1;
      animation: checkPulse 1.1s ease-in-out infinite alternate;
    }
    @keyframes checkPulse { from { opacity: 0.78; } to { opacity: 1; } }

    /* Legal Move Indicators */
    .legal-dot {
      position: absolute;
      width: 26%;
      height: 26%;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, rgba(185, 240, 110, 0.92), rgba(70, 120, 40, 0.72));
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.45), inset 0 1px 2px rgba(255,255,255,0.55);
      pointer-events: none;
      z-index: 2;
      transition: transform 0.12s ease;
    }
    .square:hover .legal-dot { transform: scale(1.18); }

    .legal-ring {
      position: absolute;
      width: 84%;
      height: 84%;
      border-radius: 50%;
      border: 4px solid rgba(255, 210, 95, 0.82);
      box-shadow: 0 0 10px rgba(255, 200, 75, 0.45), inset 0 0 8px rgba(255, 200, 75, 0.35);
      pointer-events: none;
      z-index: 2;
    }

    /* Piece & Contact Ground Shadow */
    .piece-shadow {
      position: absolute;
      bottom: 8%;
      width: 68%;
      height: 18%;
      border-radius: 50%;
      background: radial-gradient(ellipse at center, rgba(0, 0, 0, 0.56) 0%, rgba(0, 0, 0, 0.2) 55%, transparent 78%);
      pointer-events: none;
      z-index: 2;
      transition: opacity 0.12s ease, transform 0.12s ease;
    }

    .piece {
      position: relative;
      width: 88%;
      height: 88%;
      z-index: 3;
      cursor: grab;
      will-change: transform;
      touch-action: none;
      transition: transform 0.2s ease;
    }
    body.view-3d .piece {
      transform: rotateX(-16deg) translateY(-6%) scale(1.06);
      transform-origin: bottom center;
    }

    .piece svg {
      width: 100%;
      height: 100%;
      display: block;
      filter: drop-shadow(0 4px 4px rgba(0, 0, 0, 0.44));
    }

    /* Floating Lifted Drag Ghost */
    #drag-ghost {
      position: fixed;
      top: 0; left: 0;
      pointer-events: none;
      z-index: 100;
      display: none;
      will-change: transform;
    }
    #drag-ghost svg {
      width: 100%;
      height: 100%;
      display: block;
      filter: drop-shadow(0 18px 16px rgba(0, 0, 0, 0.65));
    }

    .arrow-layer, .fx-canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }
    .arrow-layer { z-index: 6; }
    .fx-canvas { z-index: 8; }

    .opening-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.78rem;
      color: var(--muted);
      padding: 2px 6px;
    }
    .opening-name {
      color: var(--gold);
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Glassmorphic Control Sidebar */
    .sidebar {
      background: var(--glass);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border: 1px solid var(--border-glass);
      border-top-color: var(--border-highlight);
      border-radius: 12px;
      padding: 15px;
      display: flex;
      flex-direction: column;
      gap: 11px;
      box-shadow: 0 20px 45px rgba(0, 0, 0, 0.55);
    }

    .brand {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border-glass);
      padding-bottom: 10px;
    }
    .brand h1 {
      font-size: 1.08rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 8px;
      letter-spacing: -0.2px;
    }
    .badge {
      font-size: 0.65rem;
      background: linear-gradient(135deg, rgba(217, 178, 95, 0.25), rgba(217, 178, 95, 0.08));
      color: var(--gold);
      border: 1px solid rgba(217, 178, 95, 0.45);
      padding: 2px 7px;
      border-radius: 99px;
      font-weight: 700;
      text-transform: uppercase;
    }

    .brand-btns { display: flex; gap: 6px; }

    .status-box {
      background: var(--glass-2);
      border-left: 4px solid var(--accent);
      padding: 9px 12px;
      border-radius: 7px;
      font-size: 0.87rem;
      font-weight: 600;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .status-box.check { border-left-color: var(--danger); color: #ffabab; }
    .status-box.gameover { border-left-color: var(--gold); color: #ffe7a8; }
    .status-box.review { border-left-color: #5ca4f7; color: #b5d7ff; }

    .settings-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }
    .field { display: flex; flex-direction: column; gap: 4px; }
    .field label {
      font-size: 0.69rem;
      text-transform: uppercase;
      letter-spacing: 0.7px;
      color: var(--muted);
      font-weight: 700;
    }

    select, button, input, textarea {
      font-family: inherit;
      font-size: 0.82rem;
      border-radius: 7px;
      border: 1px solid var(--border-glass);
      background: rgba(18, 21, 28, 0.82);
      color: var(--text);
      padding: 7px 10px;
    }

    select, button { cursor: pointer; transition: all 0.15s ease; }
    button:hover:not(:disabled) {
      background: rgba(52, 58, 74, 0.9);
      border-color: var(--border-highlight);
      transform: translateY(-1px);
    }
    button:active:not(:disabled) { transform: translateY(0); }
    button:disabled { opacity: 0.38; cursor: not-allowed; }

    button.primary {
      background: linear-gradient(135deg, #96c75d 0%, #6f9840 100%);
      color: #0d100a;
      font-weight: 700;
      border-color: rgba(255, 255, 255, 0.25);
      box-shadow: 0 4px 12px rgba(127, 166, 80, 0.3);
    }
    button.primary:hover:not(:disabled) {
      background: linear-gradient(135deg, #a6d66d 0%, #7da84b 100%);
    }

    .actions-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 7px; }

    .moves-panel { display: flex; flex-direction: column; gap: 6px; flex: 1; min-height: 170px; }
    .moves-header { display: flex; justify-content: space-between; align-items: center; }
    .moves-header span { font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.7px; color: var(--muted); font-weight: 700; }

    .move-list {
      background: rgba(10, 12, 16, 0.72);
      border: 1px solid var(--border-glass);
      border-radius: 7px;
      padding: 6px;
      height: 205px;
      overflow-y: auto;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 0.83rem;
      box-shadow: inset 0 2px 8px rgba(0, 0, 0, 0.5);
    }
    .move-list::-webkit-scrollbar { width: 6px; }
    .move-list::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.14); border-radius: 99px; }

    .move-row { display: grid; grid-template-columns: 34px 1fr 1fr; align-items: center; padding: 2px 4px; border-radius: 4px; }
    .move-row:nth-child(odd) { background: rgba(255, 255, 255, 0.02); }
    .move-num { color: var(--muted); font-size: 0.76rem; }
    .move-cell { padding: 3px 6px; border-radius: 4px; cursor: pointer; }
    .move-cell:hover { background: rgba(255, 255, 255, 0.08); }
    .move-cell.active { background: rgba(138, 184, 86, 0.35); color: #fff; font-weight: 700; }

    .nav-bar { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
    .nav-bar button { padding: 6px; font-weight: 700; }

    /* Overlays */
    .overlay {
      position: absolute;
      inset: 0;
      background: rgba(8, 10, 14, 0.76);
      backdrop-filter: blur(6px);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 25;
      padding: 16px;
    }
    .overlay.open { display: flex; }

    .dialog {
      background: var(--glass-2);
      border: 1px solid var(--border-highlight);
      border-radius: 12px;
      padding: 20px;
      text-align: center;
      max-width: 340px;
      width: 100%;
      box-shadow: 0 24px 50px rgba(0, 0, 0, 0.8);
    }
    .dialog h2 { font-size: 1.2rem; margin-bottom: 6px; color: var(--gold); }
    .dialog p  { font-size: 0.86rem; color: var(--muted); margin-bottom: 14px; }

    .promo-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
    .promo-btn {
      aspect-ratio: 1 / 1;
      padding: 6px;
      background: radial-gradient(circle, rgba(255,255,255,0.12), rgba(0,0,0,0.25));
      border: 1px solid var(--border-highlight);
    }
    .promo-btn:hover { border-color: var(--gold); background: rgba(217, 178, 95, 0.22); }

    .dialog-actions { display: flex; gap: 8px; justify-content: center; }

    .global-modal {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.78);
      backdrop-filter: blur(6px);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 60;
      padding: 16px;
    }
    .global-modal.open { display: flex; }
    .global-dialog {
      background: var(--panel);
      border: 1px solid var(--border-highlight);
      border-radius: 12px;
      padding: 20px;
      width: 100%;
      max-width: 480px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .global-dialog textarea { width: 100%; min-height: 92px; font-family: ui-monospace, monospace; font-size: 0.79rem; }
    .fen-row { display: flex; gap: 8px; }
    .fen-row input { flex: 1; font-family: ui-monospace, monospace; font-size: 0.78rem; }
    .tools-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .hint-msg { font-size: 0.78rem; color: var(--danger); min-height: 16px; }

    @media (max-width: 980px) {
      .studio { grid-template-columns: 1fr; max-width: 600px; }
      .eval-col { display: none; }
      .move-list { height: 150px; }
    }
  </style>
</head>
<body>
  <!-- Shared Studio-Lit SVG Material Gradients -->
  <svg width="0" height="0" style="position:absolute;pointer-events:none" aria-hidden="true">
    <defs id="piece-material-defs">
      <linearGradient id="mat-w-fill" x1="15%" y1="10%" x2="85%" y2="92%">
        <stop offset="0%" stop-color="#fffdf8" />
        <stop offset="52%" stop-color="#f0e4cc" />
        <stop offset="100%" stop-color="#cab58c" />
      </linearGradient>
      <linearGradient id="mat-w-stroke" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#7a6242" />
        <stop offset="100%" stop-color="#3c2d1b" />
      </linearGradient>
      <linearGradient id="mat-w-detail" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#6b5436" />

  <script>
    // =========================================================================
    // 1. PROCEDURAL TEXTURES & LUXURY MATERIAL ENGINE
    // =========================================================================
    function makeWoodTexture(base, grain, seed, horizontal = true) {
      const c = document.createElement("canvas");
      c.width = 256; c.height = 256;
      const ctx = c.getContext("2d");
      ctx.fillStyle = `rgb(${base[0]},${base[1]},${base[2]})`;
      ctx.fillRect(0, 0, 256, 256);

      let s = seed;
      const rnd = () => { s = (s * 16807) % 2147483647; return (s - 1) / 2147483646; };

      // Organic grain bands
      for (let i = 0; i < 160; i++) {
        const y0 = rnd() * 256;
        const amp = 2 + rnd() * 6;
        const freq = 0.015 + rnd() * 0.025;
        const phase = rnd() * Math.PI * 2;
        ctx.strokeStyle = `rgba(${grain[0]},${grain[1]},${grain[2]},${0.05 + rnd() * 0.14})`;
        ctx.lineWidth = 0.7 + rnd() * 2.1;
        ctx.beginPath();
        for (let t = 0; t <= 256; t += 8) {
          const offset = Math.sin(t * freq + phase) * amp;
          if (horizontal) t === 0 ? ctx.moveTo(t, y0 + offset) : ctx.lineTo(t, y0 + offset);
          else t === 0 ? ctx.moveTo(y0 + offset, t) : ctx.lineTo(y0 + offset, t);
        }
        ctx.stroke();
      }

      // Subtle satin varnish gradient
      const sheen = ctx.createLinearGradient(0, 0, 256, 256);
      sheen.addColorStop(0, "rgba(255,255,255,0.07)");
      sheen.addColorStop(0.5, "rgba(255,255,255,0)");
      sheen.addColorStop(1, "rgba(0,0,0,0.09)");
      ctx.fillStyle = sheen;
      ctx.fillRect(0, 0, 256, 256);
      return `url(${c.toDataURL("image/png")})`;
    }

    function makeMarbleTexture(base, vein, seed) {
      const c = document.createElement("canvas");
      c.width = 256; c.height = 256;
      const ctx = c.getContext("2d");
      ctx.fillStyle = `rgb(${base[0]},${base[1]},${base[2]})`;
      ctx.fillRect(0, 0, 256, 256);

      let s = seed;
      const rnd = () => { s = (s * 16807) % 2147483647; return (s - 1) / 2147483646; };

      // Mineral clouds
      for (let i = 0; i < 24; i++) {
        const x = rnd() * 256, y = rnd() * 256, rad = 30 + rnd() * 80;
        const g = ctx.createRadialGradient(x, y, 2, x, y, rad);
        g.addColorStop(0, `rgba(${vein[0]},${vein[1]},${vein[2]},${0.03 + rnd() * 0.05})`);
        g.addColorStop(1, "rgba(0,0,0,0)");
        ctx.fillStyle = g;
        ctx.fillRect(0, 0, 256, 256);
      }

      // Branching veins
      for (let i = 0; i < 16; i++) {
        let x = rnd() * 256, y = rnd() * 256;
        let ang = rnd() * Math.PI * 2;
        ctx.strokeStyle = `rgba(${vein[0]},${vein[1]},${vein[2]},${0.1 + rnd() * 0.22})`;
        ctx.lineWidth = 0.6 + rnd() * 1.6;
        ctx.beginPath();
        ctx.moveTo(x, y);
        for (let step = 0; step < 32; step++) {
          ang += (rnd() - 0.5) * 0.7;
          x += Math.cos(ang) * 9;
          y += Math.sin(ang) * 9;
          ctx.lineTo(x, y);
        }
        ctx.stroke();
      }

      const polish = ctx.createLinearGradient(0, 0, 256, 256);
      polish.addColorStop(0, "rgba(255,255,255,0.11)");
      polish.addColorStop(0.55, "rgba(255,255,255,0)");
      polish.addColorStop(1, "rgba(0,0,0,0.08)");
      ctx.fillStyle = polish;
      ctx.fillRect(0, 0, 256, 256);
      return `url(${c.toDataURL("image/png")})`;
    }

    const BOARD_THEMES = {
      walnut: () => ({
        light: makeWoodTexture([235, 211, 173], [186, 146, 98], 101, true),
        dark:  makeWoodTexture([148, 97, 62], [84, 48, 25], 202, true),
        frame: makeWoodTexture([62, 36, 22], [28, 14, 7], 303, true),
        frameBg: "#351e12",
        trim: "rgba(217, 178, 95, 0.52)",
        coord: "#dec69e",
        ambient: "rgba(217, 178, 95, 0.09)"
      }),
      marble: () => ({
        light: makeMarbleTexture([236, 237, 240], [160, 166, 178], 404),
        dark:  makeMarbleTexture([42, 46, 54], [210, 216, 226], 505),
        frame: makeMarbleTexture([26, 29, 36], [130, 140, 158], 606),
        frameBg: "#1b1e24",
        trim: "rgba(210, 220, 235, 0.45)",
        coord: "#cfd6e3",
        ambient: "rgba(180, 200, 235, 0.08)"
      }),
      emerald: () => ({
        light: makeWoodTexture([234, 235, 210], [198, 202, 166], 707, true),
        dark:  makeWoodTexture([86, 126, 74], [48, 78, 40], 808, true),
        frame: makeWoodTexture([34, 48, 32], [16, 24, 15], 909, true),
        frameBg: "#21301f",
        trim: "rgba(217, 178, 95, 0.45)",
        coord: "#d4dcb8",
        ambient: "rgba(130, 190, 95, 0.08)"
      }),
      obsidian: () => ({
        light: makeMarbleTexture([154, 164, 182], [95, 108, 128], 111),
        dark:  makeMarbleTexture([44, 53, 70], [18, 22, 30], 222),
        frame: makeMarbleTexture([20, 24, 34], [62, 76, 102], 333),
        frameBg: "#141822",
        trim: "rgba(98, 176, 235, 0.45)",
        coord: "#a9bdd6",
        ambient: "rgba(84, 152, 225, 0.09)"
      })
    };

    const cachedBoardTextures = {};
    function applyBoardTheme(name) {
      if (!cachedBoardTextures[name]) cachedBoardTextures[name] = BOARD_THEMES[name]();
      const t = cachedBoardTextures[name];
      const root = document.documentElement.style;
      root.setProperty("--tex-light", t.light);
      root.setProperty("--tex-dark", t.dark);
      root.setProperty("--tex-frame", t.frame);
      root.setProperty("--frame-bg", t.frameBg);
      root.setProperty("--frame-trim", t.trim);
      root.setProperty("--coord-color", t.coord);
      root.setProperty("--ambient-hue", t.ambient);
    }

    const PIECE_THEMES = {
      ivory: {
        wFill: ["#fffdf7", "#efe2c8", "#c8b186"],
        wStroke: ["#7a6140", "#3a2a16"],
        wDetail: ["#6b5234", "#382714"],
        bFill: ["#4d5361", "#22252d", "#0d0e12"],
        bStroke: ["#7e879c", "#090a0d"],
        bDetail: ["#e5c883", "#9e7f3c"]
      },
      imperial: {
        wFill: ["#fff4cc", "#e8c468", "#a87e28"],
        wStroke: ["#6e4f12", "#2e1e05"],
        wDetail: ["#5c400c", "#2b1b04"],
        bFill: ["#393e4a", "#171a21", "#07080b"],
        bStroke: ["#d4af53", "#07080b"],
        bDetail: ["#f5d784", "#b38a32"]
      },
      jade: {
        wFill: ["#ffffff", "#e5eef4", "#b7c9d6"],
        wStroke: ["#4d6273", "#23303b"],
        wDetail: ["#4a6173", "#273542"],
        bFill: ["#4ea688", "#23634e", "#0e3327"],
        bStroke: ["#95e0c4", "#082119"],
        bDetail: ["#d4f7ea", "#7bc9ac"]
      },
      classic: {
        wFill: ["#ffffff", "#f2f2f2", "#d8d8d8"],
        wStroke: ["#333333", "#111111"],
        wDetail: ["#222222", "#111111"],
        bFill: ["#454545", "#242424", "#121212"],
        bStroke: ["#666666", "#050505"],
        bDetail: ["#e6e6e6", "#bfbfbf"]
      }
    };

    function applyPieceTheme(name) {
      const p = PIECE_THEMES[name];
      const setStops = (id, colors) => {
        const stops = document.querySelectorAll(`#${id} stop`);
        colors.forEach((col, i) => { if (stops[i]) stops[i].setAttribute("stop-color", col); });
      };
      setStops("mat-w-fill", p.wFill);
      setStops("mat-w-stroke", p.wStroke);
      setStops("mat-w-detail", p.wDetail);
      setStops("mat-b-fill", p.bFill);
      setStops("mat-b-stroke", p.bStroke);
      setStops("mat-b-detail", p.bDetail);
    }

    // =========================================================================
    // 2. CANVAS PARTICLE & IMPACT FX ENGINE
    // =========================================================================
    const fxCanvas = document.getElementById("fx-canvas");
    const fxCtx = fxCanvas.getContext("2d");
    let fxParticles = [];
    let fxRunning = false;

    function squareCenter(r, c, flipped) {
      const vr = flipped ? 7 - r : r;
      const vc = flipped ? 7 - c : c;
      return { x: vc * 100 + 50, y: vr * 100 + 50 };
    }

    function startFxLoop() {
      if (fxRunning) return;
      fxRunning = true;
      const tick = () => {
        fxCtx.clearRect(0, 0, 800, 800);
        for (let i = fxParticles.length - 1; i >= 0; i--) {
          const p = fxParticles[i];
          p.life += 1;
          const prog = p.life / p.maxLife;
          if (prog >= 1) { fxParticles.splice(i, 1); continue; }

          if (p.kind === "ring") {
            const rad = p.r0 + (p.r1 - p.r0) * (1 - Math.pow(1 - prog, 3));
            fxCtx.beginPath();
            fxCtx.arc(p.x, p.y, rad, 0, Math.PI * 2);
            fxCtx.strokeStyle = `rgba(${p.rgb}, ${(1 - prog) * p.alpha})`;
            fxCtx.lineWidth = p.lw * (1 - prog * 0.6);
            fxCtx.stroke();
          } else if (p.kind === "spark") {
            p.x += p.vx;
            p.y += p.vy;
            p.vx *= 0.94;
            p.vy *= 0.94;
            fxCtx.beginPath();
            fxCtx.arc(p.x, p.y, p.size * (1 - prog * 0.7), 0, Math.PI * 2);
            fxCtx.fillStyle = `rgba(${p.rgb}, ${(1 - prog) * 0.95})`;
            fxCtx.fill();
          }
        }
        if (fxParticles.length > 0) requestAnimationFrame(tick);
        else fxRunning = false;
      };
      requestAnimationFrame(tick);
    }

    function spawnLandFX(r, c, flipped, isCapture, isCheck) {
      const { x, y } = squareCenter(r, c, flipped);
      fxParticles.push({
        kind: "ring", x, y, r0: 14, r1: isCapture ? 68 : 52,
        rgb: isCapture ? "245, 195, 85" : "245, 232, 195",
        alpha: isCapture ? 0.85 : 0.48, lw: isCapture ? 5 : 3, life: 0, maxLife: 24
      });
      if (isCapture) {
        for (let i = 0; i < 18; i++) {
          const ang = (Math.PI * 2 * i) / 18 + Math.random() * 0.3;
          const spd = 2.2 + Math.random() * 4.5;
          fxParticles.push({
            kind: "spark", x, y, vx: Math.cos(ang) * spd, vy: Math.sin(ang) * spd,
            size: 2.2 + Math.random() * 2.8,
            rgb: i % 2 === 0 ? "255, 210, 95" : "255, 130, 80",
            life: 0, maxLife: 22 + Math.floor(Math.random() * 14)
          });
        }
      }
      if (isCheck) {
        fxParticles.push({
          kind: "ring", x, y, r0: 18, r1: 95,
          rgb: "255, 72, 72", alpha: 0.9, lw: 6, life: 0, maxLife: 32
        });
      }
      startFxLoop();
    }

    function spawnVictoryFX() {
      for (let i = 0; i < 55; i++) {
        const x = 150 + Math.random() * 500;
        const y = 150 + Math.random() * 500;
        const ang = Math.random() * Math.PI * 2;
        const spd = 1.5 + Math.random() * 5.2;
        fxParticles.push({
          kind: "spark", x, y, vx: Math.cos(ang) * spd, vy: Math.sin(ang) * spd,
          size: 2.5 + Math.random() * 3.5,
          rgb: i % 3 === 0 ? "255, 215, 100" : (i % 3 === 1 ? "160, 225, 110" : "255, 255, 255"),
          life: 0, maxLife: 40 + Math.floor(Math.random() * 25)
        });
      }
      startFxLoop();
    }

    // =========================================================================
    // 3. STUDIO-LIT STAUNTON SVG PIECES (Shared Gradient Refs)
    // =========================================================================
    function getPieceSVG(piece) {
      if (!piece) return "";
      const isW = piece[0] === "w";
      const type = piece[1];
      const fill = `url(#mat-${isW ? "w" : "b"}-fill)`;
      const stroke = `url(#mat-${isW ? "w" : "b"}-stroke)`;
      const detail = `url(#mat-${isW ? "w" : "b"}-detail)`;

      const svgMap = {
        P: `
          <path d="M 22.5,9 C 19.5,9 17.5,11.2 17.5,14 C 17.5,15.6 18.3,17 19.5,17.8 C 16.5,19 14.5,21.8 14.5,25 C 14.5,27 15.4,28.8 16.8,30 C 13.8,31.2 11.5,34.2 11.5,38.5 L 33.5,38.5 C 33.5,34.2 31.2,31.2 28.2,30 C 29.6,28.8 30.5,27 30.5,25 C 30.5,21.8 28.5,19 25.5,17.8 C 26.7,17 27.5,15.6 27.5,14 C 27.5,11.2 25.5,9 22.5,9 z"
            fill="${fill}" stroke="${stroke}" stroke-width="1.45" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M 18.5,19.5 Q 22.5,18.2 26.5,19.5 M 14.5,34.5 L 30.5,34.5" stroke="${detail}" stroke-width="1.15" fill="none" stroke-linecap="round"/>
        `,
        R: `
          <g fill="${fill}" stroke="${stroke}" stroke-width="1.45" stroke-linecap="round" stroke-linejoin="round">
            <path d="M 9,39 L 36,39 L 36,36 L 9,36 L 9,39 z"/>
            <path d="M 12,36 L 12,32 L 33,32 L 33,36 L 12,36 z"/>
            <path d="M 11,14 L 11,9 L 15,9 L 15,11 L 20,11 L 20,9 L 25,9 L 25,11 L 30,11 L 30,9 L 34,9 L 34,14"/>
            <path d="M 34,14 L 31,17 L 14,17 L 11,14"/>
            <path d="M 31,17 L 31,29.5 L 14,29.5 L 14,17"/>
            <path d="M 31,29.5 L 32.5,32 L 12.5,32 L 14,29.5"/>
            <path d="M 11,14 L 34,14"/>
            <path d="M 14,17 L 31,17 M 14,29.5 L 31,29.5 M 12.5,32 L 32.5,32 M 12,36 L 33,36" stroke="${detail}" stroke-width="1" fill="none" opacity="0.85"/>
          </g>
        `,
        N: `

    // =========================================================================

    function createEngineCore() {
      const PIECE_VAL = { P: 100, N: 320, B: 330, R: 500, Q: 900, K: 20000 };

      const PST_MG = {
        P: [
          [  0,  0,  0,  0,  0,  0,  0,  0],
          [ 50, 50, 50, 50, 50, 50, 50, 50],
          [ 10, 10, 20, 30, 30, 20, 10, 10],
          [  5,  5, 10, 27, 27, 10,  5,  5],
          [  0,  0,  0, 24, 24,  0,  0,  0],

          [  5, 10, 10,-22,-22, 10, 10,  5],

        ],
        N: [
          [-50,-40,-30,-30,-30,-30,-40,-50],
          [-40,-20,  0,  0,  0,  0,-20,-40],
          [-30,  0, 10, 15, 15, 10,  0,-30],
          [-30,  5, 15, 20, 20, 15,  5,-30],
          [-30,  0, 15, 20, 20, 15,  0,-30],
          [-30,  5, 10, 15, 15, 10,  5,-30],
          [-40,-20,  0,  5,  5,  0,-20,-40],
          [-50,-40,-30,-30,-30,-30,-40,-50]
        ],
        B: [
          [-20,-10,-10,-10,-10,-10,-10,-20],
          [-10,  0,  0,  0,  0,  0,  0,-10],
          [-10,  0,  5, 10, 10,  5,  0,-10],
          [-10,  5,  5, 10, 10,  5,  5,-10],
          [-10,  0, 12, 10, 10, 12,  0,-10],
          [-10, 10, 10, 10, 10, 10, 10,-10],
          [-10,  5,  0,  0,  0,  0,  5,-10],
          [-20,-10,-10,-10,-10,-10,-10,-20]
        ],
        R: [
          [  0,  0,  0,  0,  0,  0,  0,  0],
          [  5, 12, 12, 12, 12, 12, 12,  5],
          [ -5,  0,  0,  0,  0,  0,  0, -5],
          [ -5,  0,  0,  0,  0,  0,  0, -5],
          [ -5,  0,  0,  0,  0,  0,  0, -5],
          [ -5,  0,  0,  0,  0,  0,  0, -5],
          [ -5,  0,  0,  0,  0,  0,  0, -5],
          [  0,  0,  0,  6,  6,  0,  0,  0]
        ],
        Q: [
          [-20,-10,-10, -5, -5,-10,-10,-20],
          [-10,  0,  0,  0,  0,  0,  0,-10],
          [-10,  0,  5,  5,  5,  5,  0,-10],
          [ -5,  0,  5,  5,  5,  5,  0, -5],
          [  0,  0,  5,  5,  5,  5,  0, -5],
          [-10,  5,  5,  5,  5,  5,  0,-10],
          [-10,  0,  5,  0,  0,  0,  0,-10],
          [-20,-10,-10, -5, -5,-10,-10,-20]
        ],
        K: [
          [-30,-40,-40,-50,-50,-40,-40,-30],
          [-30,-40,-40,-50,-50,-40,-40,-30],
          [-30,-40,-40,-50,-50,-40,-40,-30],
          [-30,-40,-40,-50,-50,-40,-40,-30],
          [-20,-30,-30,-40,-40,-30,-30,-20],
          [-10,-20,-20,-20,-20,-20,-20,-10],
          [ 20, 20,  0,  0,  0,  0, 20, 20],
          [ 20, 30, 10,  0,  0, 10, 30, 20]
        ]
      };

      const PST_K_EG = [
        [-50,-40,-30,-20,-20,-30,-40,-50],
        [-30,-20,-10,  0,  0,-10,-20,-30],
        [-30,-10, 20, 30, 30, 20,-10,-30],
        [-30,-10, 30, 40, 40, 30,-10,-30],
        [-30,-10, 30, 40, 40, 30,-10,-30],
        [-30,-10, 20, 30, 30, 20,-10,-30],
        [-30,-30,  0,  0,  0,  0,-30,-30],
        [-50,-30,-30,-30,-30,-30,-30,-50]
      ];

      function inBounds(r, c) { return r >= 0 && r < 8 && c >= 0 && c < 8; }

      function cloneState(s) {
        return {
          board: s.board.map(r => r.slice()),
          turn: s.turn,
          castling: { ...s.castling },
          enPassant: s.enPassant ? { ...s.enPassant } : null,
          halfMoveClock: s.halfMoveClock,
          fullMove: s.fullMove,
          captured: { w: s.captured.w.slice(), b: s.captured.b.slice() },
          lastMove: s.lastMove ? { ...s.lastMove } : null
        };
      }

      function findKing(board, color) {
        const target = color + "K";
        for (let r = 0; r < 8; r++) {
          for (let c = 0; c < 8; c++) {
            if (board[r][c] === target) return { r, c };
          }
        }
        return null;
      }

      function isSquareAttacked(board, r, c, attacker) {
        const pawnDir = attacker === "w" ? 1 : -1;
        if (inBounds(r + pawnDir, c - 1) && board[r + pawnDir][c - 1] === attacker + "P") return true;
        if (inBounds(r + pawnDir, c + 1) && board[r + pawnDir][c + 1] === attacker + "P") return true;

        const jumps = [[-2,-1],[-2,1],[-1,-2],[-1,2],[1,-2],[1,2],[2,-1],[2,1]];
        for (let i = 0; i < 8; i++) {
          const nr = r + jumps[i][0], nc = c + jumps[i][1];
          if (inBounds(nr, nc) && board[nr][nc] === attacker + "N") return true;
        }
        for (let dr = -1; dr <= 1; dr++) {
          for (let dc = -1; dc <= 1; dc++) {
            if (dr === 0 && dc === 0) continue;
            const kr = r + dr, kc = c + dc;
            if (inBounds(kr, kc) && board[kr][kc] === attacker + "K") return true;
          }
        }
        const ortho = [[-1,0],[1,0],[0,-1],[0,1]];
        for (let i = 0; i < 4; i++) {
          let nr = r + ortho[i][0], nc = c + ortho[i][1];
          while (inBounds(nr, nc)) {
            const p = board[nr][nc];
            if (p) { if (p[0] === attacker && (p[1] === "R" || p[1] === "Q")) return true; break; }
            nr += ortho[i][0]; nc += ortho[i][1];
          }
        }
        const diag = [[-1,-1],[-1,1],[1,-1],[1,1]];
        for (let i = 0; i < 4; i++) {
          let nr = r + diag[i][0], nc = c + diag[i][1];
          while (inBounds(nr, nc)) {
            const p = board[nr][nc];
            if (p) { if (p[0] === attacker && (p[1] === "B" || p[1] === "Q")) return true; break; }
            nr += diag[i][0]; nc += diag[i][1];
          }
        }
        return false;
      }

      function isKingInCheck(board, color) {
        const k = findKing(board, color);
        return k ? isSquareAttacked(board, k.r, k.c, color === "w" ? "b" : "w") : false;
      }

      function getPseudoMovesForPiece(state, r, c) {
        const piece = state.board[r][c];
        if (!piece) return [];
        const color = piece[0], type = piece[1];
        const opp = color === "w" ? "b" : "w";
        const moves = [];

        if (type === "P") {
          const dir = color === "w" ? -1 : 1;
          const startRow = color === "w" ? 6 : 1;
          const promoRow = color === "w" ? 0 : 7;
          if (inBounds(r + dir, c) && !state.board[r + dir][c]) {
            if (r + dir === promoRow) {
              for (const promo of ["Q", "R", "B", "N"]) moves.push({ fromR: r, fromC: c, toR: r + dir, toC: c, promo });
            } else {
              moves.push({ fromR: r, fromC: c, toR: r + dir, toC: c });
              if (r === startRow && !state.board[r + 2 * dir][c]) {
                moves.push({ fromR: r, fromC: c, toR: r + 2 * dir, toC: c, doublePush: true });
              }
            }
          }
          for (const dc of [-1, 1]) {
            const tr = r + dir, tc = c + dc;
            if (!inBounds(tr, tc)) continue;
            const target = state.board[tr][tc];
            if (target && target[0] === opp) {
              if (tr === promoRow) {
                for (const promo of ["Q", "R", "B", "N"]) moves.push({ fromR: r, fromC: c, toR: tr, toC: tc, promo });
              } else moves.push({ fromR: r, fromC: c, toR: tr, toC: tc });
            } else if (state.enPassant && state.enPassant.r === tr && state.enPassant.c === tc) {
              moves.push({ fromR: r, fromC: c, toR: tr, toC: tc, enPassant: true });
            }
          }
        } else if (type === "N") {
          const jumps = [[-2,-1],[-2,1],[-1,-2],[-1,2],[1,-2],[1,2],[2,-1],[2,1]];
          for (const [dr, dc] of jumps) {
            const tr = r + dr, tc = c + dc;
            if (inBounds(tr, tc) && (!state.board[tr][tc] || state.board[tr][tc][0] === opp)) {
              moves.push({ fromR: r, fromC: c, toR: tr, toC: tc });
            }
          }
        } else if (type === "B" || type === "R" || type === "Q") {
          const dirs = [];
          if (type !== "R") dirs.push([-1,-1],[-1,1],[1,-1],[1,1]);
          if (type !== "B") dirs.push([-1,0],[1,0],[0,-1],[0,1]);
          for (const [dr, dc] of dirs) {
            let tr = r + dr, tc = c + dc;
            while (inBounds(tr, tc)) {
              const target = state.board[tr][tc];
              if (!target) moves.push({ fromR: r, fromC: c, toR: tr, toC: tc });
              else { if (target[0] === opp) moves.push({ fromR: r, fromC: c, toR: tr, toC: tc }); break; }
              tr += dr; tc += dc;
            }
          }
        } else if (type === "K") {
          for (let dr = -1; dr <= 1; dr++) {
            for (let dc = -1; dc <= 1; dc++) {
              if (dr === 0 && dc === 0) continue;
              const tr = r + dr, tc = c + dc;
              if (inBounds(tr, tc) && (!state.board[tr][tc] || state.board[tr][tc][0] === opp)) {
                moves.push({ fromR: r, fromC: c, toR: tr, toC: tc });
              }
            }
          }
          const homeRow = color === "w" ? 7 : 0;
          if (r === homeRow && c === 4 && !isSquareAttacked(state.board, homeRow, 4, opp)) {
            if (state.castling[color + "K"] && !state.board[homeRow][5] && !state.board[homeRow][6] &&
                state.board[homeRow][7] === color + "R" &&
                !isSquareAttacked(state.board, homeRow, 5, opp) && !isSquareAttacked(state.board, homeRow, 6, opp)) {
              moves.push({ fromR: r, fromC: c, toR: homeRow, toC: 6, castle: "K" });
            }
            if (state.castling[color + "Q"] && !state.board[homeRow][3] && !state.board[homeRow][2] && !state.board[homeRow][1] &&
                state.board[homeRow][0] === color + "R" &&
                !isSquareAttacked(state.board, homeRow, 3, opp) && !isSquareAttacked(state.board, homeRow, 2, opp)) {
              moves.push({ fromR: r, fromC: c, toR: homeRow, toC: 2, castle: "Q" });
            }
          }
        }
        return moves;
      }

      function applyMove(state, move) {
        const next = cloneState(state);
        const { fromR, fromC, toR, toC } = move;
        const piece = next.board[fromR][fromC];
        const color = piece[0], type = piece[1];
        let capturedPiece = next.board[toR][toC];

        if (move.enPassant) { capturedPiece = next.board[fromR][toC]; next.board[fromR][toC] = null; }
        if (capturedPiece) next.captured[color].push(capturedPiece);

        next.board[toR][toC] = move.promo ? color + move.promo : piece;
        next.board[fromR][fromC] = null;

        if (move.castle === "K") { next.board[toR][5] = next.board[toR][7]; next.board[toR][7] = null; }
        else if (move.castle === "Q") { next.board[toR][3] = next.board[toR][0]; next.board[toR][0] = null; }

        if (type === "K") { next.castling[color + "K"] = false; next.castling[color + "Q"] = false; }
        if (type === "R") {
          if (fromR === 7 && fromC === 7) next.castling.wK = false;
          if (fromR === 7 && fromC === 0) next.castling.wQ = false;
          if (fromR === 0 && fromC === 7) next.castling.bK = false;
          if (fromR === 0 && fromC === 0) next.castling.bQ = false;
        }
        if (toR === 7 && toC === 7) next.castling.wK = false;
        if (toR === 7 && toC === 0) next.castling.wQ = false;
        if (toR === 0 && toC === 7) next.castling.bK = false;
        if (toR === 0 && toC === 0) next.castling.bQ = false;

        next.enPassant = move.doublePush ? { r: (fromR + toR) / 2, c: fromC } : null;
        next.halfMoveClock = (type === "P" || capturedPiece) ? 0 : next.halfMoveClock + 1;
        if (color === "b") next.fullMove += 1;
        next.turn = color === "w" ? "b" : "w";
        next.lastMove = { fromR, fromC, toR, toC };
        return next;
      }

      function getLegalMoves(state, color = state.turn) {
        const legal = [];
        for (let r = 0; r < 8; r++) {
          for (let c = 0; c < 8; c++) {
            const p = state.board[r][c];
            if (p && p[0] === color) {
              const pseudo = getPseudoMovesForPiece(state, r, c);
              for (let i = 0; i < pseudo.length; i++) {
                if (!isKingInCheck(applyMove(state, pseudo[i]).board, color)) legal.push(pseudo[i]);
              }
            }
          }
        }
        return legal;
      }

      function isInsufficientMaterial(board) {
        const pieces = [];
        for (let r = 0; r < 8; r++) {
          for (let c = 0; c < 8; c++) {
            const p = board[r][c];
            if (p && p[1] !== "K") pieces.push({ p, r, c });
          }
        }
        if (pieces.length === 0) return true;
        if (pieces.length === 1 && (pieces[0].p[1] === "N" || pieces[0].p[1] === "B")) return true;
        if (pieces.length === 2 && pieces[0].p[1] === "B" && pieces[1].p[1] === "B") {
          return ((pieces[0].r + pieces[0].c) % 2) === ((pieces[1].r + pieces[1].c) % 2);
        }
        return false;
      }

      function getPositionKey(state) {
        let key = "";
        for (let r = 0; r < 8; r++) for (let c = 0; c < 8; c++) key += state.board[r][c] || ".";
        key += "|" + state.turn + "|" + (state.castling.wK ? "K" : "") + (state.castling.wQ ? "Q" : "") + (state.castling.bK ? "k" : "") + (state.castling.bQ ? "q" : "");
        if (state.enPassant) {
          const epR = state.enPassant.r, epC = state.enPassant.c;
          const pawnR = state.turn === "w" ? epR + 1 : epR - 1;
          if ((inBounds(pawnR, epC - 1) && state.board[pawnR][epC - 1] === state.turn + "P") ||
              (inBounds(pawnR, epC + 1) && state.board[pawnR][epC + 1] === state.turn + "P")) {
            key += `|${epR},${epC}`;
          }
        }
        return key;
      }

      function evaluateBoard(state) {
        let nonKingMat = 0, wB = 0, bB = 0;
        for (let r = 0; r < 8; r++) {
          for (let c = 0; c < 8; c++) {
            const p = state.board[r][c];
            if (!p || p[1] === "K") continue;
            nonKingMat += PIECE_VAL[p[1]];
            if (p === "wB") wB++;
            if (p === "bB") bB++;
          }
        }
        const isEndgame = nonKingMat <= 2600;
        let score = (wB >= 2 ? 30 : 0) - (bB >= 2 ? 30 : 0);
        for (let r = 0; r < 8; r++) {
          for (let c = 0; c < 8; c++) {
            const p = state.board[r][c];
            if (!p) continue;
            const type = p[1], color = p[0];
            const pstRow = color === "w" ? r : 7 - r;
            const table = (type === "K" && isEndgame) ? PST_K_EG : PST_MG[type];
            const val = PIECE_VAL[type] + table[pstRow][c];
            score += color === "w" ? val : -val;
          }
        }
        return score;
      }

      function orderMoves(state, moves, ttBestKey) {
        return moves.sort((a, b) => {
          const kA = `${a.fromR}${a.fromC}${a.toR}${a.toC}${a.promo || ""}`;
          const kB = `${b.fromR}${b.fromC}${b.toR}${b.toC}${b.promo || ""}`;
          if (kA === ttBestKey) return -1;
          if (kB === ttBestKey) return 1;
          const capA = state.board[a.toR][a.toC] ? PIECE_VAL[state.board[a.toR][a.toC][1]] - PIECE_VAL[state.board[a.fromR][a.fromC][1]] / 10 : (a.enPassant ? 90 : 0);
          const capB = state.board[b.toR][b.toC] ? PIECE_VAL[state.board[b.toR][b.toC][1]] - PIECE_VAL[state.board[b.fromR][b.fromC][1]] / 10 : (b.enPassant ? 90 : 0);
          return (capB + (b.promo === "Q" ? 800 : 0)) - (capA + (a.promo === "Q" ? 800 : 0));
        });
      }

      function quiescence(state, alpha, beta, maximizing, qDepth, deadline) {
        if (Date.now() > deadline) return evaluateBoard(state);
        const standPat = evaluateBoard(state);
        if (qDepth <= 0) return standPat;
        if (maximizing) {
          if (standPat >= beta) return beta;
          if (alpha < standPat) alpha = standPat;
          const caps = orderMoves(state, getLegalMoves(state).filter(m => state.board[m.toR][m.toC] || m.enPassant || m.promo === "Q"));
          for (let i = 0; i < caps.length; i++) {
            const sc = quiescence(applyMove(state, caps[i]), alpha, beta, false, qDepth - 1, deadline);
            if (sc > alpha) alpha = sc;
            if (alpha >= beta) return beta;
          }
          return alpha;
        } else {
          if (standPat <= alpha) return alpha;
          if (beta > standPat) beta = standPat;
          const caps = orderMoves(state, getLegalMoves(state).filter(m => state.board[m.toR][m.toC] || m.enPassant || m.promo === "Q"));
          for (let i = 0; i < caps.length; i++) {
            const sc = quiescence(applyMove(state, caps[i]), alpha, beta, true, qDepth - 1, deadline);
            if (sc < beta) beta = sc;
            if (beta <= alpha) return alpha;
          }
          return beta;
        }
      }

      function searchBestMove(state, targetDepth, useQSearch = true) {
        const deadline = Date.now() + (targetDepth >= 4 ? 1100 : (targetDepth === 3 ? 500 : 250));
        const tt = new Map();

        function alphabeta(st, depth, alpha, beta, maximizing) {
          if (Date.now() > deadline) throw "TIMEOUT";
          const posKey = getPositionKey(st);
          const ttEntry = tt.get(posKey);
          if (ttEntry && ttEntry.depth >= depth) {
            if (ttEntry.flag === "EXACT") return ttEntry.score;
            if (ttEntry.flag === "LOWER" && ttEntry.score > alpha) alpha = ttEntry.score;
            else if (ttEntry.flag === "UPPER" && ttEntry.score < beta) beta = ttEntry.score;
            if (alpha >= beta) return ttEntry.score;
          }
          const moves = getLegalMoves(st);
          if (moves.length === 0) {
            if (isKingInCheck(st.board, st.turn)) return maximizing ? (-100000 - depth) : (100000 + depth);
            return 0;
          }
          if (isInsufficientMaterial(st.board) || st.halfMoveClock >= 100) return 0;
          if (depth === 0) return useQSearch ? quiescence(st, alpha, beta, maximizing, 3, deadline) : evaluateBoard(st);

          orderMoves(st, moves, ttEntry ? ttEntry.bestKey : null);
          const origA = alpha, origB = beta;
          let bestVal = maximizing ? -Infinity : Infinity, bestKey = null;

          for (let i = 0; i < moves.length; i++) {
            const m = moves[i];
            if (m.promo && m.promo !== "Q") continue;
            const val = alphabeta(applyMove(st, m), depth - 1, alpha, beta, !maximizing);
            const k = `${m.fromR}${m.fromC}${m.toR}${m.toC}${m.promo || ""}`;
            if (maximizing) { if (val > bestVal) { bestVal = val; bestKey = k; } if (val > alpha) alpha = val; }
            else { if (val < bestVal) { bestVal = val; bestKey = k; } if (val < beta) beta = val; }
            if (alpha >= beta) break;
          }
          if (tt.size < 40000) {
            tt.set(posKey, { depth, score: bestVal, flag: bestVal <= origA ? "UPPER" : (bestVal >= origB ? "LOWER" : "EXACT"), bestKey });
          }
          return bestVal;
        }

        const rootMoves = getLegalMoves(state);
        if (rootMoves.length === 0) return { move: null, score: 0 };
        const maximizing = state.turn === "w";
        let finalMove = rootMoves[0], finalScore = 0;

        for (let d = 1; d <= targetDepth; d++) {
          try {
            let bestScore = maximizing ? -Infinity : Infinity, bestCandidates = [];
            orderMoves(state, rootMoves, `${finalMove.fromR}${finalMove.fromC}${finalMove.toR}${finalMove.toC}${finalMove.promo || ""}`);
            for (let i = 0; i < rootMoves.length; i++) {
              const m = rootMoves[i];
              if (m.promo && m.promo !== "Q") continue;
              const score = alphabeta(applyMove(state, m), d - 1, -Infinity, Infinity, !maximizing);
              if (maximizing) {
                if (score > bestScore) { bestScore = score; bestCandidates = [m]; }
                else if (score === bestScore) bestCandidates.push(m);
              } else {
                if (score < bestScore) { bestScore = score; bestCandidates = [m]; }
                else if (score === bestScore) bestCandidates.push(m);
              }
            }
            finalMove = bestCandidates[Math.floor(Math.random() * bestCandidates.length)];
            finalScore = bestScore;
            if (Math.abs(finalScore) >= 99000) break;
          } catch (e) {
            if (e === "TIMEOUT") break;
            throw e;
          }
        }
        return { move: finalMove, score: finalScore };
      }

      function evaluatePosition(state, depth = 2) {
        return searchBestMove(state, depth, true).score;
      }

      return {
        cloneState, findKing, isSquareAttacked, isKingInCheck,
        getLegalMoves, applyMove, isInsufficientMaterial, getPositionKey,
        evaluateBoard, searchBestMove, evaluatePosition
      };
    }

    const Engine = createEngineCore();

    let aiWorker = null;

    try {
      const workerBlob = new Blob([`
        ${createEngineCore.toString()}
        const Engine = createEngineCore();
        self.onmessage = function(e) {
          const { id, type, state, depth, useQ } = e.data;
          if (type === "search") self.postMessage({ id, res: Engine.searchBestMove(state, depth, useQ) });
          else if (type === "eval") self.postMessage({ id, score: Engine.evaluatePosition(state, depth) });
        };
      `], { type: "application/javascript" });
      aiWorker = new Worker(URL.createObjectURL(workerBlob));
      aiWorker.onmessage = (e) => {
        const resolver = pendingWorkerCalls.get(e.data.id);
        if (resolver) {
          pendingWorkerCalls.delete(e.data.id);
          resolver(e.data.res !== undefined ? e.data.res : e.data.score);
        }
      };
    } catch (_) { aiWorker = null; }

    function runEngineTask(payload) {
      if (aiWorker) {
        return new Promise(resolve => {
          const id = workerMsgId++;
          pendingWorkerCalls.set(id, resolve);
          aiWorker.postMessage({ id, ...payload });
        });
      }
      return new Promise(resolve => {
        setTimeout(() => {
          if (payload.type === "search") resolve(Engine.searchBestMove(payload.state, payload.depth, payload.useQ));
          else resolve(Engine.evaluatePosition(payload.state, payload.depth));
        }, 25);
      });
    }

    const FILES = ["a", "b", "c", "d", "e", "f", "g", "h"];
    let audioCtx = null, soundOn = true;

    function playTone(kind) {
      if (!soundOn) return;
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === "suspended") audioCtx.resume();
        const t = audioCtx.currentTime;
        const osc = audioCtx.createOscillator(), g = audioCtx.createGain();
        osc.connect(g); g.connect(audioCtx.destination);
        if (kind === "capture") {
          osc.type = "triangle"; osc.frequency.setValueAtTime(240, t); osc.frequency.exponentialRampToValueAtTime(65, t + 0.09);
          g.gain.setValueAtTime(0.24, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.09);
          osc.start(t); osc.stop(t + 0.09);
        } else if (kind === "check") {
          osc.type = "sine"; osc.frequency.setValueAtTime(540, t); osc.frequency.exponentialRampToValueAtTime(320, t + 0.14);
          g.gain.setValueAtTime(0.2, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.14);
          osc.start(t); osc.stop(t + 0.14);
        } else if (kind === "castle") {
          osc.type = "sine"; osc.frequency.setValueAtTime(210, t); osc.frequency.setValueAtTime(260, t + 0.05);
          g.gain.setValueAtTime(0.16, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.12);
          osc.start(t); osc.stop(t + 0.12);
        } else if (kind === "gameover") {
          osc.type = "triangle"; osc.frequency.setValueAtTime(380, t); osc.frequency.exponentialRampToValueAtTime(190, t + 0.25);
          g.gain.setValueAtTime(0.22, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.25);
          osc.start(t); osc.stop(t + 0.25);
        } else {

          g.gain.setValueAtTime(0.16, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.06);

    }

    function createInitialState() {
      return {
        board: [
          ["bR","bN","bB","bQ","bK","bB","bN","bR"],
          ["bP","bP","bP","bP","bP","bP","bP","bP"],
          [null,null,null,null,null,null,null,null],
          [null,null,null,null,null,null,null,null],
          [null,null,null,null,null,null,null,null],
          [null,null,null,null,null,null,null,null],
          ["wP","wP","wP","wP","wP","wP","wP","wP"],
          ["wR","wN","wB","wQ","wK","wB","wN","wR"]
        ],
        turn: "w",
        castling: { wK: true, wQ: true, bK: true, bQ: true },
        enPassant: null,
        halfMoveClock: 0,
        fullMove: 1,
        captured: { w: [], b: [] },
        lastMove: null
      };
    }

    function stateToFEN(state) {
      const rows = [];
      for (let r = 0; r < 8; r++) {
        let rowStr = "", empty = 0;
        for (let c = 0; c < 8; c++) {
          const p = state.board[r][c];
          if (!p) empty++;
          else { if (empty) { rowStr += empty; empty = 0; } rowStr += p[0] === "w" ? p[1] : p[1].toLowerCase(); }
        }
        if (empty) rowStr += empty;
        rows.push(rowStr);
      }
      let cast = "";
      if (state.castling.wK) cast += "K"; if (state.castling.wQ) cast += "Q";
      if (state.castling.bK) cast += "k"; if (state.castling.bQ) cast += "q";
      const ep = state.enPassant ? FILES[state.enPassant.c] + (8 - state.enPassant.r) : "-";
      return `${rows.join("/")} ${state.turn} ${cast || "-"} ${ep} ${state.halfMoveClock} ${state.fullMove}`;
    }

    function parseFEN(fen) {
      const parts = fen.trim().split(/\s+/);
      if (parts.length < 4) throw new Error("Invalid FEN format.");
      const ranks = parts[0].split("/");
      if (ranks.length !== 8) throw new Error("FEN must have 8 ranks.");
      const board = Array.from({ length: 8 }, () => Array(8).fill(null));
      let wK = 0, bK = 0;
      for (let r = 0; r < 8; r++) {
        let c = 0;
        for (const ch of ranks[r]) {
          if (/[1-8]/.test(ch)) c += parseInt(ch, 10);
          else if (/[pnbrqkPNBRQK]/.test(ch)) {
            if (c >= 8) throw new Error("Too many squares in rank.");
            const col = ch === ch.toUpperCase() ? "w" : "b", tp = ch.toUpperCase();
            if (tp === "K") col === "w" ? wK++ : bK++;
            board[r][c++] = col + tp;
          } else throw new Error(`Invalid piece: ${ch}`);
        }
        if (c !== 8) throw new Error("Invalid rank width.");
      }
      if (wK !== 1 || bK !== 1) throw new Error("Must have 1 White King and 1 Black King.");
      const turn = parts[1];
      if (turn !== "w" && turn !== "b") throw new Error("Invalid active color.");
      if (Engine.isKingInCheck(board, turn === "w" ? "b" : "w")) throw new Error("Opponent King is in check.");
      const castStr = parts[2];
      let enPassant = null;
      if (parts[3] !== "-") {
        const fc = FILES.indexOf(parts[3][0]), fr = 8 - parseInt(parts[3][1], 10);
        if (fc < 0 || fr < 0 || fr > 7) throw new Error("Invalid en passant square.");
        enPassant = { r: fr, c: fc };
      }
      return {
        board, turn,
        castling: {
          wK: castStr.includes("K") && board[7][4] === "wK" && board[7][7] === "wR",
          wQ: castStr.includes("Q") && board[7][4] === "wK" && board[7][0] === "wR",
          bK: castStr.includes("k") && board[0][4] === "bK" && board[0][7] === "bR",
          bQ: castStr.includes("q") && board[0][4] === "bK" && board[0][0] === "bR"
        },
        enPassant,
        halfMoveClock: parseInt(parts[4] || "0", 10) || 0,
        fullMove: parseInt(parts[5] || "1", 10) || 1,
        captured: { w: [], b: [] },
        lastMove: null
      };
    }

    function formatSAN(prevState, move, nextState, nextLegal) {
      const checkSuffix = Engine.isKingInCheck(nextState.board, nextState.turn) ? (nextLegal.length === 0 ? "#" : "+") : "";
      if (move.castle === "K") return "O-O" + checkSuffix;
      if (move.castle === "Q") return "O-O-O" + checkSuffix;
      const piece = prevState.board[move.fromR][move.fromC], type = piece[1];
      const isCap = Boolean(prevState.board[move.toR][move.toC]) || move.enPassant;
      const dest = FILES[move.toC] + (8 - move.toR);
      let san = "";
      if (type === "P") {
        if (isCap) san += FILES[move.fromC] + "x";
        san += dest;
        if (move.promo) san += "=" + move.promo;
      } else {
        san += type;
        const peers = Engine.getLegalMoves(prevState, piece[0]).filter(
          m => prevState.board[m.fromR][m.fromC] === piece && m.toR === move.toR && m.toC === move.toC &&
               (m.fromR !== move.fromR || m.fromC !== move.fromC)
        );
        if (peers.length > 0) {
          if (!peers.some(m => m.fromC === move.fromC)) san += FILES[move.fromC];
          else if (!peers.some(m => m.fromR === move.fromR)) san += (8 - move.fromR);
          else san += FILES[move.fromC] + (8 - move.fromR);
        }
        if (isCap) san += "x";
        san += dest;
      }
      return san + checkSuffix;
    }

    function formatClock(sec) {
      const clamped = Math.max(0, sec), mins = Math.floor(clamped / 60), rem = clamped % 60;
      if (clamped < 15) return `${mins}:${rem.toFixed(1).padStart(4, "0")}`;
      return `${String(mins).padStart(2, "0")}:${String(Math.floor(rem)).padStart(2, "0")}`;
    }

    function startClockTicker() {
      stopClockTicker();
      if (baseTimeSec <= 0) return;
      lastTickTime = performance.now();
      clockInterval = setInterval(() => {
        if (!clockStarted || gameOverInfo) return;
        const now = performance.now(), dt = (now - lastTickTime) / 1000;
        lastTickTime = now;
        const liveState = moveHistory.length === 0 ? rootState : moveHistory[moveHistory.length - 1].stateAfter;
        const act = liveState.turn;
        clocks[act] = Math.max(0, clocks[act] - dt);
        renderClocks();
        if (clocks[act] <= 0) {
          const winner = act === "w" ? "Black" : "White";
          endGame(`${winner} Wins!`, `${act === "w" ? "White" : "Black"} ran out of time`, act === "w" ? "0-1" : "1-0");

      const topC = document.getElementById("top-clock"), botC = document.getElementById("bottom-clock");

      topC.classList.remove("hidden"); botC.classList.remove("hidden");
      const tc = flipped ? "w" : "b", bc = flipped ? "b" : "w";
      const liveState = moveHistory.length === 0 ? rootState : moveHistory[moveHistory.length - 1].stateAfter;
      topC.textContent = formatClock(clocks[tc]); botC.textContent = formatClock(clocks[bc]);
      topC.classList.toggle("active", clockStarted && !gameOverInfo && liveState.turn === tc);
      botC.classList.toggle("active", clockStarted && !gameOverInfo && liveState.turn === bc);
      topC.classList.toggle("low", clocks[tc] < 15);
      botC.classList.toggle("low", clocks[bc] < 15);

    function updateEvalBar(cp) {
      const fill = document.getElementById("eval-fill");

      document.getElementById("eval-bar").classList.toggle("flipped", flipped);
      let pct = 50, text = "0.0";
      if (Math.abs(cp) >= 90000) {
        const m = Math.max(1, Math.ceil((100005 - Math.abs(cp)) / 2));
        pct = cp > 0 ? 100 : 0; text = `M${m}`;

        pct = Math.max(4, Math.min(96, 50 + 50 * (2 / (1 + Math.exp(-0.004 * cp)) - 1)));

    // =========================================================================

    function endGame(title, subtitle, resultTag) {
      gameOverInfo = { title, subtitle, resultTag };
