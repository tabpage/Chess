    // =========================================================================
    // 7. CLOCK SYSTEM
    // =========================================================================
    function formatClock(sec) {
      const clamped = Math.max(0, sec);
      const mins = Math.floor(clamped / 60);
      const rem = clamped % 60;
      if (clamped < 15) return `${mins}:${rem.toFixed(1).padStart(4, "0")}`;
      return `${String(mins).padStart(2, "0")}:${String(Math.floor(rem)).padStart(2, "0")}`;
    }

    function startClockTicker() {
      stopClockTicker();
      if (baseTimeSec <= 0) return;
      lastTickTime = performance.now();
      clockInterval = setInterval(() => {
        if (!clockStarted || gameOverInfo) return;
        const now = performance.now();
        const dt = (now - lastTickTime) / 1000;
        lastTickTime = now;
        const liveState = moveHistory.length === 0 ? rootState : moveHistory[moveHistory.length - 1].stateAfter;
        const activeColor = liveState.turn;
        clocks[activeColor] = Math.max(0, clocks[activeColor] - dt);
        renderClocks();

        if (clocks[activeColor] <= 0) {
          const winner = activeColor === "w" ? "Black" : "White";
          endGame(`${winner} Wins!`, `${activeColor === "w" ? "White" : "Black"} ran out of time.`, activeColor === "w" ? "0-1" : "1-0");
        }
      }, 100);
    }

    function stopClockTicker() {
      if (clockInterval) { clearInterval(clockInterval); clockInterval = null; }
    }

    function renderClocks() {
      const topClock = document.getElementById("top-clock");
      const bottomClock = document.getElementById("bottom-clock");
      if (baseTimeSec <= 0) {
        topClock.classList.add("hidden");
        bottomClock.classList.add("hidden");
        return;
      }
      topClock.classList.remove("hidden");
      bottomClock.classList.remove("hidden");

      const topC = flipped ? "w" : "b";
      const botC = flipped ? "b" : "w";
      const liveState = moveHistory.length === 0 ? rootState : moveHistory[moveHistory.length - 1].stateAfter;

      topClock.textContent = formatClock(clocks[topC]);
      bottomClock.textContent = formatClock(clocks[botC]);

      topClock.classList.toggle("active", clockStarted && !gameOverInfo && liveState.turn === topC);
      bottomClock.classList.toggle("active", clockStarted && !gameOverInfo && liveState.turn === botC);
      topClock.classList.toggle("low", clocks[topC] < 15);
      bottomClock.classList.toggle("low", clocks[botC] < 15);
    }

    // =========================================================================
    // 8. EVALUATION BAR
    // =========================================================================
    function updateEvalBar(centipawns) {
      const fill = document.getElementById("eval-fill");
      const topLbl = document.getElementById("eval-top");
      const botLbl = document.getElementById("eval-bottom");
      const bar = document.getElementById("eval-bar");
      bar.classList.toggle("flipped", flipped);

      let pct = 50;
      let text = "0.0";
      if (Math.abs(centipawns) >= 90000) {
        const mateIn = Math.max(1, Math.ceil((100005 - Math.abs(centipawns)) / 2));
        pct = centipawns > 0 ? 100 : 0;
        text = `M${mateIn}`;
      } else {
        // Sigmoid scaling for natural visual curve
        pct = 50 + 50 * (2 / (1 + Math.exp(-0.004 * centipawns)) - 1);
        pct = Math.max(4, Math.min(96, pct));
        const pawns = (centipawns / 100).toFixed(1);
        text = centipawns > 0 ? `+${pawns}` : `${pawns}`;
      }

      fill.style.height = `${pct}%`;
      if (centipawns >= 0) {
        botLbl.textContent = flipped ? "" : text;
        topLbl.textContent = flipped ? text : "";
      } else {
        topLbl.textContent = flipped ? "" : text;
        botLbl.textContent = flipped ? text : "";
      }
      if (flipped) {
        topLbl.style.color = "#16181d";
        botLbl.style.color = "#f2f4f8";
      } else {
        topLbl.style.color = "#f2f4f8";
        botLbl.style.color = "#16181d";
      }
    }

    async function refreshEvalAsync(state, entryRef) {
      const sid = gameSessionId;
      const score = await runEngineTask({ type: "eval", state, depth: 2 });
      if (sid !== gameSessionId) return;
      if (entryRef) entryRef.evalScore = score;
      if (getActiveState() === state) updateEvalBar(score);
    }

    // =========================================================================
    // 9. EXECUTION, RULES & AI TURN
    // =========================================================================
    function endGame(title, subtitle, resultTag) {
      gameOverInfo = { title, subtitle, resultTag };
      stopClockTicker();
      playTone("gameover");
      document.getElementById("go-title").textContent = title;
      document.getElementById("go-subtitle").textContent = subtitle;
      goOverlay.classList.add("open");
      render();
    }

    function checkEndConditions(nextState, nextLegal) {
      const posKey = Engine.getPositionKey(nextState);
      const count = (positionCounts.get(posKey) || 0) + 1;
      positionCounts.set(posKey, count);

      if (nextLegal.length === 0) {
        if (Engine.isKingInCheck(nextState.board, nextState.turn)) {
          const winner = nextState.turn === "w" ? "Black" : "White";
          endGame(`${winner} Wins!`, "Victory by Checkmate", nextState.turn === "w" ? "0-1" : "1-0");
        } else {
          endGame("Draw", "Stalemate — no legal moves", "1/2-1/2");
        }
        return true;
      }
      if (count >= 3) {
        endGame("Draw", "Threefold Repetition", "1/2-1/2");
        return true;
      }
      if (nextState.halfMoveClock >= 100) {
        endGame("Draw", "50-Move Rule", "1/2-1/2");
        return true;
      }
      if (Engine.isInsufficientMaterial(nextState.board)) {
        endGame("Draw", "Insufficient Material", "1/2-1/2");
        return true;
      }
      return false;
    }

    function executeMove(move, precomputedEval = null) {
      const prevState = moveHistory.length === 0 ? rootState : moveHistory[moveHistory.length - 1].stateAfter;
      const movingColor = prevState.turn;
      const isCapture = Boolean(prevState.board[move.toR][move.toC]) || move.enPassant;

      const nextState = Engine.applyMove(prevState, move);
      const nextLegal = Engine.getLegalMoves(nextState);
      const san = formatSAN(prevState, move, nextState, nextLegal);

      // Clock update
      if (baseTimeSec > 0) {
        if (!clockStarted) {
          clockStarted = true;
          lastTickTime = performance.now();
        } else {
          clocks[movingColor] += incrementSec;
        }
      }

      const entry = {
        stateBefore: prevState,
        stateAfter: nextState,
        san,
        move,
        evalScore: precomputedEval !== null ? precomputedEval : Engine.evaluateBoard(nextState)
      };

      moveHistory.push(entry);
      viewIndex = moveHistory.length;
      selectedSq = null;
      selectedLegalMoves = [];
      hintArrow = null;
      annoSquares.clear();
      annoArrows = [];

      const ended = checkEndConditions(nextState, nextLegal);

      if (!ended) {
        if (Engine.isKingInCheck(nextState.board, nextState.turn)) playTone("check");
        else if (move.castle) playTone("castle");
        else if (isCapture) playTone("capture");
        else playTone("move");
      }

      render(move);
      updateEvalBar(entry.evalScore);
      if (precomputedEval === null && !ended) refreshEvalAsync(nextState, entry);

      if (!ended) {
        maybeTriggerAI();
      }
    }

    function tryBookMove(state) {
      const depth = parseInt(depthSelect.value, 10);
      if (depth < 3 || moveHistory.length > 10) return null;
      const seq = moveHistory.map(h => h.san.replace(/[+#]/g, "")).join(" ");
      const replies = BOOK_REPLIES[seq];
      if (!replies || replies.length === 0) return null;

      const legal = Engine.getLegalMoves(state);
      const legalWithSan = legal.map(m => ({
        move: m,
        san: formatSAN(state, m, Engine.applyMove(state, m), []).replace(/[+#]/g, "")
      }));

      const candidates = [];
      for (const rSan of replies) {
        const match = legalWithSan.find(x => x.san === rSan);
        if (match) candidates.push(match.move);
      }
      if (candidates.length === 0) return null;
      return candidates[Math.floor(Math.random() * candidates.length)];
    }

    async function maybeTriggerAI() {
      const aiColor = getAIColor();
      const liveState = moveHistory.length === 0 ? rootState : moveHistory[moveHistory.length - 1].stateAfter;
      if (gameOverInfo || !aiColor || liveState.turn !== aiColor || aiBusy) return;

      aiBusy = true;
      const sid = gameSessionId;
      renderStatus();

      const bookMove = tryBookMove(liveState);
      let chosenMove = bookMove;
      let evalScore = null;

      if (bookMove) {
        await new Promise(r => setTimeout(r, 220));
      } else {
        const depth = parseInt(depthSelect.value, 10);
        const useQ = depth >= 2;
        const res = await runEngineTask({ type: "search", state: liveState, depth, useQ });
        chosenMove = res.move;
        evalScore = res.score;
      }

      if (sid !== gameSessionId) { aiBusy = false; return; }
      aiBusy = false;
      if (chosenMove) {
        executeMove(chosenMove, evalScore);
        // Check queued premove
        if (premove && !gameOverInfo) {
          const pm = premove;
          premove = null;
          const postAIState = getActiveState();
          const legal = Engine.getLegalMoves(postAIState);
          const match = legal.find(m => m.fromR === pm.fromR && m.fromC === pm.fromC && m.toR === pm.toR && m.toC === pm.toC && (!m.promo || m.promo === "Q"));
          if (match) {
            setTimeout(() => executeMove(match), 60);
          } else {
            renderBoard();
          }
        }
      }
    }

    // =========================================================================
    // 10. HUMAN INTERACTION (Click, Drag, Premove, Right-Click Arrows)
    // =========================================================================
    function openPromoModal(moves) {
      pendingPromo = moves;
      const color = getActiveState().turn;
      promoChoices.innerHTML = "";
      for (const t of ["Q", "R", "B", "N"]) {
        const btn = document.createElement("button");
        btn.className = "promo-btn";
        btn.innerHTML = getPieceSVG(color + t);
        btn.onclick = () => {
          const chosen = pendingPromo.find(m => m.promo === t);
          pendingPromo = null;
          promoOverlay.classList.remove("open");
          if (chosen) executeMove(chosen);
        };
        promoChoices.appendChild(btn);
      }
      promoOverlay.classList.add("open");
    }

    function handleSquareLeftClick(r, c) {
      if (pendingPromo || gameOverInfo) return;
      annoSquares.clear();
      annoArrows = [];
      hintArrow = null;

      if (!isLiveView()) {
        // Clicking board while reviewing returns user gently or just clears annotations
        renderArrows();
        renderBoard();
        return;
      }

      const state = getActiveState();
      const aiColor = getAIColor();

      // Premove mode if AI is currently thinking
      if (aiColor && state.turn === aiColor) {
        const humanColor = aiColor === "w" ? "b" : "w";
        if (selectedSq) {
          if (selectedSq.r !== r || selectedSq.c !== c) {
            premove = { fromR: selectedSq.r, fromC: selectedSq.c, toR: r, toC: c };
          }
          selectedSq = null;
          selectedLegalMoves = [];
        } else if (state.board[r][c] && state.board[r][c][0] === humanColor) {
          selectedSq = { r, c };
          premove = null;
        } else {
          premove = null;
        }
        renderBoard();
        renderArrows();
        return;
      }

      if (!isHumanTurn()) return;

      if (selectedSq) {
        const matches = selectedLegalMoves.filter(m => m.toR === r && m.toC === c);
        if (matches.length > 0) {
          if (matches.length > 1 && matches[0].promo) openPromoModal(matches);
          else executeMove(matches[0]);
          return;
        }
      }

      const piece = state.board[r][c];
      if (piece && piece[0] === state.turn) {
        if (selectedSq && selectedSq.r === r && selectedSq.c === c) {
          selectedSq = null;
          selectedLegalMoves = [];
        } else {
          selectedSq = { r, c };
          selectedLegalMoves = Engine.getLegalMoves(state).filter(m => m.fromR === r && m.fromC === c);
        }
      } else {
        selectedSq = null;
        selectedLegalMoves = [];
      }
      renderBoard();
      renderArrows();
    }

    function coordsFromPointer(e) {
      const rect = boardEl.getBoundingClientRect();
      const x = Math.max(0, Math.min(rect.width - 1, e.clientX - rect.left));
      const y = Math.max(0, Math.min(rect.height - 1, e.clientY - rect.top));
      const vc = Math.floor((x / rect.width) * 8);
      const vr = Math.floor((y / rect.height) * 8);
      return {
        r: flipped ? 7 - vr : vr,
        c: flipped ? 7 - vc : vc
      };
    }

    boardStage.addEventListener("contextmenu", e => e.preventDefault());
    boardStage.addEventListener("mousedown", e => {
      if (e.button === 2) rightDragStart = coordsFromPointer(e);
    });
    boardStage.addEventListener("mouseup", e => {
      if (e.button === 2 && rightDragStart) {
        const end = coordsFromPointer(e);
        if (end.r === rightDragStart.r && end.c === rightDragStart.c) {
          const key = `${end.r},${end.c}`;
          if (annoSquares.has(key)) annoSquares.delete(key);
          else annoSquares.add(key);
          renderBoard();
        } else {
          const idx = annoArrows.findIndex(a =>
            a.fromR === rightDragStart.r && a.fromC === rightDragStart.c && a.toR === end.r && a.toC === end.c
          );
          if (idx >= 0) annoArrows.splice(idx, 1);
          else annoArrows.push({ fromR: rightDragStart.r, fromC: rightDragStart.c, toR: end.r, toC: end.c, color: "orange" });
          renderArrows();
        }
        rightDragStart = null;
      }
    });

    // =========================================================================
    // 11. RENDERING (Board, Slide Animation, Arrows, Sidebar)
    // =========================================================================
    function renderArrows() {
      const defs = arrowLayer.querySelector("defs").outerHTML;
      let content = defs;
      const allArrows = [...annoArrows];
      if (hintArrow) allArrows.push(hintArrow);

      for (const a of allArrows) {
        const fvr = flipped ? 7 - a.fromR : a.fromR;
        const fvc = flipped ? 7 - a.fromC : a.fromC;
        const tvr = flipped ? 7 - a.toR : a.toR;
        const tvc = flipped ? 7 - a.toC : a.toC;

        const x1 = fvc * 100 + 50, y1 = fvr * 100 + 50;
        const x2 = tvc * 100 + 50, y2 = tvr * 100 + 50;
        const dx = x2 - x1, dy = y2 - y1;
        const len = Math.hypot(dx, dy) || 1;
        const ux = dx / len, uy = dy / len;
        const sx = x1 + ux * 14, sy = y1 + uy * 14;
        const ex = x2 - ux * 18, ey = y2 - uy * 18;

        const strokeCol = a.color === "cyan" ? "rgba(56, 189, 248, 0.9)" : "rgba(245, 166, 35, 0.85)";
        const marker = a.color === "cyan" ? "url(#arrow-cyan)" : "url(#arrow-orange)";
        content += `<line x1="${sx}" y1="${sy}" x2="${ex}" y2="${ey}" stroke="${strokeCol}" stroke-width="14" stroke-linecap="round" marker-end="${marker}" />`;
      }
      arrowLayer.innerHTML = content;
    }

    function renderBoard(animateMove = null) {
      const state = getActiveState();
      boardEl.innerHTML = "";
      const inCheck = Engine.isKingInCheck(state.board, state.turn);
      const kingPos = inCheck ? Engine.findKing(state.board, state.turn) : null;
      let animatedPieceEl = null;

      for (let vr = 0; vr < 8; vr++) {
        for (let vc = 0; vc < 8; vc++) {
          const r = flipped ? 7 - vr : vr;
          const c = flipped ? 7 - vc : vc;
          const isLight = (r + c) % 2 === 0;

          const sq = document.createElement("div");
          sq.className = `square ${isLight ? "light" : "dark"}`;
          sq.dataset.r = r;
          sq.dataset.c = c;

          if (state.lastMove &&
              ((state.lastMove.fromR === r && state.lastMove.fromC === c) ||
               (state.lastMove.toR === r && state.lastMove.toC === c))) {
            sq.classList.add("last-move");
          }
          if (selectedSq && selectedSq.r === r && selectedSq.c === c) sq.classList.add("selected");
          if (premove && ((premove.fromR === r && premove.fromC === c) || (premove.toR === r && premove.toC === c))) {
            sq.classList.add("premove");
          }
          if (annoSquares.has(`${r},${c}`)) sq.classList.add("anno-sq");
          if (kingPos && kingPos.r === r && kingPos.c === c) sq.classList.add("in-check");

          if (vc === 0) {
            const rl = document.createElement("span");
            rl.className = "coord-rank";
            rl.textContent = 8 - r;
            sq.appendChild(rl);
          }
          if (vr === 7) {
            const fl = document.createElement("span");
            fl.className = "coord-file";
            fl.textContent = FILES[c];
            sq.appendChild(fl);
          }

          const isDest = selectedLegalMoves.some(m => m.toR === r && m.toC === c);
          if (isDest) {
            const dot = document.createElement("div");
            const isCap = Boolean(state.board[r][c]) || selectedLegalMoves.some(m => m.toR === r && m.toC === c && m.enPassant);
            dot.className = isCap ? "legal-ring" : "legal-dot";
            sq.appendChild(dot);
          }

          const piece = state.board[r][c];
          if (piece) {
            const pEl = document.createElement("div");
            pEl.className = "piece";
            pEl.innerHTML = getPieceSVG(piece);

            const canDrag = isLiveView() && !gameOverInfo &&
                            ((isHumanTurn() && piece[0] === state.turn) ||
                             (getAIColor() && piece[0] !== getAIColor()));
            if (canDrag) {
              pEl.draggable = true;
              pEl.addEventListener("dragstart", (e) => {
                selectedSq = { r, c };
                selectedLegalMoves = isHumanTurn() ? Engine.getLegalMoves(state).filter(m => m.fromR === r && m.fromC === c) : [];
                e.dataTransfer.setData("text/plain", `${r},${c}`);
                setTimeout(() => renderHighlightsOnly(), 0);
              });
            }

            if (animateMove && animateMove.toR === r && animateMove.toC === c) {
              animatedPieceEl = pEl;
            }
            sq.appendChild(pEl);
          }

          sq.addEventListener("click", (e) => { if (e.button === 0) handleSquareLeftClick(r, c); });
          sq.addEventListener("dragover", (e) => e.preventDefault());
          sq.addEventListener("drop", (e) => {
            e.preventDefault();
            handleSquareLeftClick(r, c);
          });

          boardEl.appendChild(sq);
        }
      }

      if (animatedPieceEl && animateMove) {
        const fvr = flipped ? 7 - animateMove.fromR : animateMove.fromR;
        const fvc = flipped ? 7 - animateMove.fromC : animateMove.fromC;
        const tvr = flipped ? 7 - animateMove.toR : animateMove.toR;
        const tvc = flipped ? 7 - animateMove.toC : animateMove.toC;
        const dxPct = (fvc - tvc) * 116; // relative to piece's 86% box
        const dyPct = (fvr - tvr) * 116;
        animatedPieceEl.style.transition = "none";
        animatedPieceEl.style.transform = `translate(${dxPct}%, ${dyPct}%)`;
        animatedPieceEl.getBoundingClientRect();
        animatedPieceEl.style.transition = "transform 155ms cubic-bezier(0.22, 1, 0.36, 1)";
        animatedPieceEl.style.transform = "translate(0, 0)";
      }
    }

    function renderHighlightsOnly() {
      boardEl.querySelectorAll(".square").forEach(sq => {
        const r = parseInt(sq.dataset.r, 10);
        const c = parseInt(sq.dataset.c, 10);
        sq.classList.toggle("selected", selectedSq && selectedSq.r === r && selectedSq.c === c);
        sq.querySelectorAll(".legal-dot, .legal-ring").forEach(n => n.remove());
        if (selectedLegalMoves.some(m => m.toR === r && m.toC === c)) {
          const dot = document.createElement("div");
          const isCap = Boolean(getActiveState().board[r][c]) || selectedLegalMoves.some(m => m.toR === r && m.toC === c && m.enPassant);
          dot.className = isCap ? "legal-ring" : "legal-dot";
          sq.appendChild(dot);
        }
      });
    }

    function renderPlayers() {
      const state = getActiveState();
      const topC = flipped ? "w" : "b";
      const botC = flipped ? "b" : "w";
      const aiColor = getAIColor();

      const labelFor = (c) => {
        const base = c === "w" ? "White" : "Black";
        if (!aiColor) return base;
        return c === aiColor ? `${base} • Engine` : `${base} • You`;
      };

      document.getElementById("top-name").textContent = labelFor(topC);
      document.getElementById("bottom-name").textContent = labelFor(botC);
      document.getElementById("top-avatar").className = `avatar ${topC}`;
      document.getElementById("top-avatar").textContent = topC === "w" ? "♔" : "♚";
      document.getElementById("bottom-avatar").className = `avatar ${botC}`;
      document.getElementById("bottom-avatar").textContent = botC === "w" ? "♔" : "♚";

      document.getElementById("top-dot").classList.toggle("active", !gameOverInfo && isLiveView() && state.turn === topC);
      document.getElementById("bottom-dot").classList.toggle("active", !gameOverInfo && isLiveView() && state.turn === botC);

      const vals = { P: 1, N: 3, B: 3, R: 5, Q: 9 };
      const sum = (arr) => arr.reduce((a, p) => a + (vals[p[1]] || 0), 0);
      const wMat = sum(state.captured.w), bMat = sum(state.captured.b);

      const drawCap = (id, c) => {
        const el = document.getElementById(id);
        const sorted = [...state.captured[c]].sort((a, b) => vals[b[1]] - vals[a[1]]);
        el.innerHTML = sorted.map(p => `<span class="cap-icon">${getPieceSVG(p)}</span>`).join("");
        const diff = c === "w" ? wMat - bMat : bMat - wMat;
        if (diff > 0) el.innerHTML += `<span class="mat-diff">+${diff}</span>`;
      };
      drawCap("top-captured", topC);
      drawCap("bottom-captured", botC);
    }

    function renderStatus() {
      const state = getActiveState();
      statusBox.className = "status-box";

      if (!isLiveView()) {
        statusBox.classList.add("review");
        statusText.textContent = `Reviewing move ${viewIndex} of ${moveHistory.length}`;
      } else if (gameOverInfo) {
        statusBox.classList.add("gameover");
        statusText.textContent = `${gameOverInfo.title} — ${gameOverInfo.subtitle}`;
      } else if (aiBusy) {
        statusText.textContent = "Engine thinking...";
      } else {
        const side = state.turn === "w" ? "White" : "Black";
        if (Engine.isKingInCheck(state.board, state.turn)) {
          statusBox.classList.add("check");
          statusText.textContent = `${side} is in Check!`;
        } else {
          statusText.textContent = `${side} to move`;
        }
      }

      const activeSans = moveHistory.slice(0, viewIndex).map(h => h.san);
      document.getElementById("opening-name").textContent = detectOpening(activeSans);
      document.getElementById("ply-counter").textContent = `${moveHistory.length} ply`;
    }

    function renderHistory() {
      moveListEl.innerHTML = "";
      for (let i = 0; i < moveHistory.length; i += 2) {
        const row = document.createElement("div");
        row.className = "move-row";

        const num = document.createElement("span");
        num.className = "move-num";
        num.textContent = `${Math.floor(i / 2) + 1}.`;
        row.appendChild(num);

        for (let offset = 0; offset < 2; offset++) {
          const idx = i + offset;
          const cell = document.createElement("span");
          if (idx < moveHistory.length) {
            cell.className = "move-cell" + (viewIndex === idx + 1 ? " active" : "");
            cell.textContent = moveHistory[idx].san;
            cell.onclick = () => jumpToHistory(idx + 1);
          } else {
            cell.textContent = "";
          }
          row.appendChild(cell);
        }
        moveListEl.appendChild(row);
      }

      if (isLiveView()) moveListEl.scrollTop = moveListEl.scrollHeight;
      else {
        const activeCell = moveListEl.querySelector(".move-cell.active");
        if (activeCell) activeCell.scrollIntoView({ block: "nearest" });
      }

      document.getElementById("undo-btn").disabled = moveHistory.length === 0 || aiBusy;
      document.getElementById("resign-btn").disabled = Boolean(gameOverInfo);
      document.getElementById("hint-btn").disabled = !isHumanTurn() || aiBusy;
      document.getElementById("nav-start").disabled = viewIndex === 0;
      document.getElementById("nav-prev").disabled = viewIndex === 0;
      document.getElementById("nav-next").disabled = isLiveView();
      document.getElementById("nav-end").disabled = isLiveView();
    }

    function render(animateMove = null) {
      renderBoard(animateMove);
      renderArrows();
      renderPlayers();
      renderClocks();
      renderStatus();
      renderHistory();
    }

    function jumpToHistory(idx) {
      viewIndex = Math.max(0, Math.min(moveHistory.length, idx));
      selectedSq = null;
      selectedLegalMoves = [];
      hintArrow = null;
      render();
      if (viewIndex === 0) updateEvalBar(0);
      else updateEvalBar(moveHistory[viewIndex - 1].evalScore);
    }

    // =========================================================================
    // 12. CONTROLS, HINT, PGN/FEN & BOOTSTRAP
    // =========================================================================
    function startNewGame(customRoot = null) {
      gameSessionId++;
      aiBusy = false;
      pendingPromo = null;
      premove = null;
      promoOverlay.classList.remove("open");
      goOverlay.classList.remove("open");

      rootState = customRoot || createInitialState();
      moveHistory = [];
      viewIndex = 0;
      selectedSq = null;
      selectedLegalMoves = [];
      gameOverInfo = null;
      annoSquares.clear();
      annoArrows = [];
      hintArrow = null;

      positionCounts = new Map();
      positionCounts.set(Engine.getPositionKey(rootState), 1);

      const [bTime, inc] = timeSelect.value.split(",").map(Number);
      baseTimeSec = bTime;
      incrementSec = inc;
      clocks = { w: bTime, b: bTime };
      clockStarted = false;
      startClockTicker();

      const aiColor = getAIColor();
      document.getElementById("depth-field").style.display = aiColor ? "flex" : "none";
      flipped = aiColor === "w";

      updateEvalBar(Engine.evaluateBoard(rootState));
      render();
      maybeTriggerAI();
    }

    document.getElementById("new-game-btn").onclick = () => startNewGame();
    document.getElementById("go-rematch").onclick = () => startNewGame();
    document.getElementById("go-review").onclick = () => goOverlay.classList.remove("open");
    modeSelect.onchange = () => startNewGame();
    timeSelect.onchange = () => startNewGame();

    themeSelect.onchange = () => {
      document.body.dataset.theme = themeSelect.value;
    };

    document.getElementById("flip-btn").onclick = () => {
      flipped = !flipped;
      const ev = viewIndex === 0 ? Engine.evaluateBoard(rootState) : moveHistory[viewIndex - 1].evalScore;
      updateEvalBar(ev);
      render();
    };

    document.getElementById("undo-btn").onclick = () => {
      if (moveHistory.length === 0 || aiBusy || pendingPromo) return;
      gameSessionId++;
      const aiColor = getAIColor();
      const liveState = moveHistory[moveHistory.length - 1].stateAfter;

      const popOne = () => {
        const removed = moveHistory.pop();
        if (removed) {
          const key = Engine.getPositionKey(removed.stateAfter);
          positionCounts.set(key, Math.max(0, (positionCounts.get(key) || 1) - 1));
        }
      };

      if (aiColor && liveState.turn !== aiColor && moveHistory.length >= 2) {
        popOne();
      }
      popOne();

      viewIndex = moveHistory.length;
      gameOverInfo = null;
      goOverlay.classList.remove("open");
      selectedSq = null;
      selectedLegalMoves = [];
      hintArrow = null;
      premove = null;

      if (baseTimeSec > 0 && !clockInterval) startClockTicker();
      const ev = viewIndex === 0 ? Engine.evaluateBoard(rootState) : moveHistory[viewIndex - 1].evalScore;
      updateEvalBar(ev);
      render();
      maybeTriggerAI();
    };

    document.getElementById("resign-btn").onclick = () => {
      if (gameOverInfo) return;
      const liveState = moveHistory.length === 0 ? rootState : moveHistory[moveHistory.length - 1].stateAfter;
      const loser = liveState.turn === "w" ? "White" : "Black";
      const winner = liveState.turn === "w" ? "Black" : "White";
      endGame(`${winner} Wins!`, `${loser} resigned`, liveState.turn === "w" ? "0-1" : "1-0");
    };

    document.getElementById("hint-btn").onclick = async () => {
      if (!isHumanTurn() || aiBusy) return;
      const btn = document.getElementById("hint-btn");
      btn.disabled = true;
      btn.textContent = "⏳...";
      const sid = gameSessionId;
      const res = await runEngineTask({ type: "search", state: getActiveState(), depth: 3, useQ: true });
      btn.textContent = "💡 Hint";
      btn.disabled = false;
      if (sid !== gameSessionId || !res.move) return;
      hintArrow = { fromR: res.move.fromR, fromC: res.move.fromC, toR: res.move.toR, toC: res.move.toC, color: "cyan" };
      renderArrows();
    };

    document.getElementById("sound-btn").onclick = () => {
      soundOn = !soundOn;
      document.getElementById("sound-btn").textContent = soundOn ? "🔊" : "🔇";
    };

    // History Scrubber
    document.getElementById("nav-start").onclick = () => jumpToHistory(0);
    document.getElementById("nav-prev").onclick  = () => jumpToHistory(viewIndex - 1);
    document.getElementById("nav-next").onclick  = () => jumpToHistory(viewIndex + 1);
    document.getElementById("nav-end").onclick   = () => jumpToHistory(moveHistory.length);

    document.addEventListener("keydown", (e) => {
      if (document.getElementById("pgn-modal").classList.contains("open")) return;
      if (e.key === "ArrowLeft") jumpToHistory(viewIndex - 1);
      else if (e.key === "ArrowRight") jumpToHistory(viewIndex + 1);
      else if (e.key === "Home") jumpToHistory(0);
      else if (e.key === "End") jumpToHistory(moveHistory.length);
      else if (e.key.toLowerCase() === "f") {
        flipped = !flipped;
        render();
      }
    });

    // PGN / FEN Modal
    const pgnModal = document.getElementById("pgn-modal");
    const fenInput = document.getElementById("fen-input");
    const fenError = document.getElementById("fen-error");
    const pgnOutput = document.getElementById("pgn-output");

    function buildPGN() {
      const opening = detectOpening(moveHistory.map(h => h.san));
      const result = gameOverInfo ? gameOverInfo.resultTag : "*";
      const aiColor = getAIColor();
      const wName = aiColor === "w" ? "Engine" : "Player 1";
      const bName = aiColor === "b" ? "Engine" : (aiColor ? "Player 1" : "Player 2");

      let headers = `[Event "Grandmaster Chess Studio"]\n[White "${wName}"]\n[Black "${bName}"]\n[Opening "${opening}"]\n[Result "${result}"]\n`;
      const startFen = stateToFEN(rootState);
      if (startFen !== "rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR w KQkq - 0 1") {
        headers += `[SetUp "1"]\n[FEN "${startFen}"]\n`;
      }

      let body = "";
      for (let i = 0; i < moveHistory.length; i += 2) {
        body += `${Math.floor(i / 2) + 1}. ${moveHistory[i].san} `;
        if (moveHistory[i + 1]) body += `${moveHistory[i + 1].san} `;
      }
      return `${headers}\n${body.trim()} ${result}`.trim();
    }

    document.getElementById("pgn-btn").onclick = () => {
      fenError.textContent = "";
      fenInput.value = stateToFEN(getActiveState());
      pgnOutput.value = buildPGN();
      pgnModal.classList.add("open");
    };

    document.getElementById("close-pgn-btn").onclick = () => pgnModal.classList.remove("open");

    document.getElementById("load-fen-btn").onclick = () => {
      try {
        const parsed = parseFEN(fenInput.value);
        fenError.textContent = "";
        pgnModal.classList.remove("open");
        startNewGame(parsed);
      } catch (err) {
        fenError.textContent = err.message;
      }
    };

    document.getElementById("copy-fen-btn").onclick = () => {
      navigator.clipboard?.writeText(fenInput.value);
      const btn = document.getElementById("copy-fen-btn");
      btn.textContent = "Copied!";
      setTimeout(() => btn.textContent = "Copy", 1200);
    };

    document.getElementById("copy-pgn-btn").onclick = () => {
      navigator.clipboard?.writeText(pgnOutput.value);
      const btn = document.getElementById("copy-pgn-btn");
      btn.textContent = "Copied PGN!";
      setTimeout(() => btn.textContent = "Copy PGN", 1200);
    };

    // Boot
    startNewGame();
  </script>
</body>
    </html>
